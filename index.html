p>\n</div>\n</div>"},{"slug":"lab-access-and-laptop-setup","title":"Lab Access and Laptop Setup","html":"<div id=\"dp-wrapper\" style=\"padding: 24px; border: 1px solid #e2e8f0; border-radius: 8px; background-color: #f8fafc; color: #334155; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6;\">\n<h3 style=\"margin: 0 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Overview</h3>\n\n<p style=\"margin: 0 0 20px; color: #1e293b; font-size: 1.125em; line-height: 1.55;\">Set up your laptop before the first lab, and use the class password and naming conventions on every device so anyone on the team can step in.</p>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Class password</h3>\n\n<p style=\"margin: 0 0 14px;\">In a real organization every device gets its own password. In this lab, every device and operating system uses the same one, so the team and the instructor can always get in:</p>\n\n<p style=\"margin: 0 0 14px;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">1PantherGeek</code></p>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #0055ff; border-radius: 4px; background-color: #f0f4ff;\">\n<p style=\"margin: 0; color: #0033aa; font-weight: 700;\">Note: This is an accepted risk</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">A shared password is a real weakness. In Cyber Hub 13 you list it in your SSP as an accepted risk, with the reason it is acceptable here.</p>\n</div>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Naming conventions</h3>\n\n<div style=\"margin: 12px 0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">Device names</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 30%;\" scope=\"col\">Device</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Name</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Core switch</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">rack<span style=\"color: #b45309; font-weight: 700;\">R</span>-core-sw</code></td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Firewall</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">rack<span style=\"color: #b45309; font-weight: 700;\">R</span>-fw</code></td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Proxmox host</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">rack<span style=\"color: #b45309; font-weight: 700;\">R</span>-pve</code></td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Web server VM</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">rack<span style=\"color: #b45309; font-weight: 700;\">R</span>-web</code></td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>FTP server VM</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">rack<span style=\"color: #b45309; font-weight: 700;\">R</span>-ftp</code></td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Scanner VM</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">rack<span style=\"color: #b45309; font-weight: 700;\">R</span>-scan</code></td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Vulnerable Pi</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">rack<span style=\"color: #b45309; font-weight: 700;\">R</span>-vulnpi</code></td>\n</tr>\n</tbody>\n</table>\n</div>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Laptop requirements</h3>\n\n<div style=\"margin: 0 0 24px; padding: 14px 16px; border: 1px solid #cbd5e1; border-left: 5px solid #003366; border-radius: 4px; background-color: #ffffff;\">\n<p style=\"margin: 0 0 8px; color: #003366; font-weight: 700;\">Before your first lab</p>\n<ul style=\"margin: 0; padding-left: 0; list-style-type: none; color: #1e293b; font-size: 0.95em;\">\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span>An Ethernet port, or a USB Ethernet adapter (the drawer has a multiport dongle).</li>\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span><a style=\"color: #003366; text-decoration: underline;\" href=\"https://www.putty.org/\" target=\"_blank\" rel=\"noopener\">PuTTY</a> for console connections (Windows).</li>\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span><a style=\"color: #003366; text-decoration: underline;\" href=\"https://www.wireshark.org/\" target=\"_blank\" rel=\"noopener\">Wireshark</a> for traffic capture.</li>\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span><a style=\"color: #003366; text-decoration: underline;\" href=\"https://nmap.org/\" target=\"_blank\" rel=\"noopener\">Nmap</a> for network discovery.</li>\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span>Each team has at least one Windows laptop. Several steps are much harder on a Mac.</li>\n</ul>\n</div>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Reaching the lab and the internet at once</h3>\n\n<h4 style=\"margin: 24px 0 8px; color: #1e293b; font-size: 1.05em;\">Why the connection breaks</h4>\n\n<p style=\"margin: 0 0 14px;\">Your rack's DHCP gives Ethernet a default gateway, so Windows sees two ways to the internet. It picks the adapter with the lower <strong>interface metric</strong>, and on many laptops that is Ethernet, which has no path to the internet. This is why the setup works on some laptops and not on others.</p>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #00aa66; border-radius: 4px; background-color: #f2faf5;\">\n<p style=\"margin: 0; color: #006633; font-weight: 700;\">Tip: How the route solves it</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">A <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">10.0.0.0/8</code> route sends lab traffic down Ethernet, because the most specific route always wins. A higher Ethernet metric sends everything else over Wi-Fi.</p>\n</div>\n\n<h4 style=\"margin: 24px 0 8px; color: #1e293b; font-size: 1.05em;\">Set it up</h4>\n\n<ol style=\"margin: 0 0 16px 20px; padding-left: 0;\">\n<li style=\"margin-bottom: 8px;\">Plug into a Data port on your own rack and confirm your Ethernet adapter has a <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">10.<span style=\"color: #b45309; font-weight: 700;\">R</span>.20.x</code> address.</li>\n<li style=\"margin-bottom: 8px;\">Open PowerShell as Administrator (right-click Start, then <kbd style=\"display: inline-block; padding: 1px 6px; border: 1px solid #cbd5e1; border-bottom-width: 3px; border-radius: 4px; background-color: #e2e8f0; color: #0f172a; font-family: inherit; font-size: 0.9em; line-height: 1.4;\">Terminal (Admin)</kbd>).</li>\n<li style=\"margin-bottom: 8px;\">Read the explanation below, then paste and run all six lines:</li>\n</ol>\n\n<div style=\"margin: 8px 0 16px 20px; border: 1px solid #1a202c; border-radius: 6px; overflow: hidden;\">\n<div style=\"padding: 5px 14px; background-color: #1a202c; color: #cbd5e1; font-size: 0.75em; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;\">Laptop &middot; PowerShell (Administrator)</div>\n<pre tabindex=\"0\" style=\"margin: 0; padding: 12px 14px; background-color: #2d3748; color: #f7fafc; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em; line-height: 1.6; overflow-x: auto;\">$lab = Get-NetIPAddress -AddressFamily IPv4 | Where-Object IPAddress -like '10.*'\n$i = $lab[0].InterfaceIndex\n$g = (Get-NetRoute -InterfaceIndex $i -DestinationPrefix 0.0.0.0/0).NextHop\nSet-NetIPInterface -InterfaceIndex $i -InterfaceMetric 500\nRemove-NetRoute -DestinationPrefix 10.0.0.0/8 -Confirm:$false -ErrorAction SilentlyContinue\nNew-NetRoute -DestinationPrefix 10.0.0.0/8 -InterfaceIndex $i -NextHop $g -PolicyStore PersistentStore</pre>\n</div>\n\n<div style=\"margin: 12px 0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">What each line does</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 10%;\" scope=\"col\">Line</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Function</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>1</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Finds the address on your laptop that starts with <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">10.</code>: your lab connection.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>2</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Saves that adapter's number in <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">$i</code>. This works whatever Windows named the adapter.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>3</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Reads that adapter's default gateway, the switch address your rack's DHCP gave it, and saves it in <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">$g</code>.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>4</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Raises that adapter's metric to 500, so Windows sends internet traffic over Wi-Fi instead.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>5</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Removes any old lab route, such as one from another rack. If there is none, it does nothing.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>6</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Adds the lab route: everything starting with <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">10.</code> goes to your rack's gateway. <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">PersistentStore</code> keeps it after you restart.</td>\n</tr>\n</tbody>\n</table>\n</div>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #00aa66; border-radius: 4px; background-color: #f2faf5;\">\n<p style=\"margin: 0; color: #006633; font-weight: 700;\">Tip: When to run it again</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">The route stays after restarts. Run it again only:</p><ul style=\"margin: 6px 0 0 20px; padding-left: 0; list-style-type: square; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">\n<li style=\"margin-bottom: 4px;\">after visiting another rack, such as in Cyber Hub 12;</li>\n<li style=\"margin-bottom: 4px;\">if you plug a USB Ethernet adapter into a different USB port. Windows treats a new port as a new adapter, so use the same port every time.</li>\n</ul>\n</div>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #0055ff; border-radius: 4px; background-color: #f0f4ff;\">\n<p style=\"margin: 0; color: #0033aa; font-weight: 700;\">Note: Is this safe to run?</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">Yes. It's good practice to understand any script before you run it.</p><ul style=\"margin: 6px 0 0 20px; padding-left: 0; list-style-type: square; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">\n<li style=\"margin-bottom: 4px;\">It only reads and changes your laptop's routing settings.</li>\n<li style=\"margin-bottom: 4px;\">It downloads, installs and sends nothing, and never touches your files or accounts.</li>\n<li style=\"margin-bottom: 4px;\">It needs Administrator rights because routing settings apply to the whole laptop.</li>\n</ul>\n</div>\n\n<h4 style=\"margin: 24px 0 8px; color: #1e293b; font-size: 1.05em;\">Check it</h4>\n\n<ul style=\"margin: 0 0 16px 20px; padding-left: 0; list-style-type: square;\">\n<li style=\"margin-bottom: 8px;\">Lab: <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">Test-NetConnection 10.<span style=\"color: #b45309; font-weight: 700;\">R</span>.100.1</code> ends with <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">PingSucceeded : True</code>.</li>\n<li style=\"margin-bottom: 8px;\">Internet: a website loads in your browser.</li>\n<li style=\"margin-bottom: 8px;\">Back from another rack (after Cyber Hub 12): plug into your own rack and run the six lines again. Line 5 clears the old route for you.</li>\n</ul>\n\n<h4 style=\"margin: 24px 0 8px; color: #1e293b; font-size: 1.05em;\">Revert the route</h4>\n\n<p style=\"margin: 0 0 14px;\">Run these two lines in PowerShell as Administrator to remove the route and put the metric back to the Windows default. They work even with the cable unplugged:</p>\n\n<div style=\"margin: 8px 0 16px 20px; border: 1px solid #1a202c; border-radius: 6px; overflow: hidden;\">\n<div style=\"padding: 5px 14px; background-color: #1a202c; color: #cbd5e1; font-size: 0.75em; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;\">Laptop &middot; PowerShell (Administrator)</div>\n<pre tabindex=\"0\" style=\"margin: 0; padding: 12px 14px; background-color: #2d3748; color: #f7fafc; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em; line-height: 1.6; overflow-x: auto;\">Remove-NetRoute -DestinationPrefix 10.0.0.0/8 -Confirm:$false -ErrorAction SilentlyContinue\nGet-NetIPInterface -AddressFamily IPv4 | Set-NetIPInterface -AutomaticMetric Enabled</pre>\n</div>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #ea580c; border-radius: 4px; background-color: #fff7ed;\">\n<p style=\"margin: 0; color: #c2410c; font-weight: 700;\">Caution: Wi-Fi turns off when you plug in the cable?</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">Some laptops switch Wi-Fi off whenever Ethernet is connected. Look for a setting named \"LAN/WLAN switching\" in the BIOS, or \"Disable upon wired connect\" in the Wi-Fi adapter's Advanced properties in Device Manager, and turn it off.</p>\n</div>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #0055ff; border-radius: 4px; background-color: #f0f4ff;\">\n<p style=\"margin: 0; color: #0033aa; font-weight: 700;\">Note: Campus Wi-Fi isn't affected</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">Campus Wi-Fi gives laptops <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">172.17.x.x</code> addresses, so the <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">10.0.0.0/8</code> route never overlaps with it.</p>\n</div>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Testing from the internet</h3>\n\n<p style=\"margin: 0 0 14px;\">Some tests need a laptop outside every rack, where a stranger on the internet would be. The instructor rack broadcasts a Wi-Fi network for this: <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">CyberHub-Internet</code>.</p>\n\n<ol style=\"margin: 0 0 16px 20px; padding-left: 0;\">\n<li style=\"margin-bottom: 8px;\">Unplug your laptop's Ethernet cable. While it's plugged in, the lab route sends traffic into your own rack instead.</li>\n<li style=\"margin-bottom: 8px;\">Join <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">CyberHub-Internet</code> with the class password, and untick Connect automatically. Your laptop gets a <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">198.51.100.x</code> address.</li>\n<li style=\"margin-bottom: 8px;\">Check it: <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">nslookup www.rack<span style=\"color: #b45309; font-weight: 700;\">R</span>.lab</code> returns <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">10.<span style=\"color: #b45309; font-weight: 700;\">R</span>.200.2</code>.</li>\n</ol>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #00aa66; border-radius: 4px; background-color: #f2faf5;\">\n<p style=\"margin: 0; color: #006633; font-weight: 700;\">Tip: Back at your rack</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">Rejoin campus Wi-Fi and plug the Ethernet cable back in. The lab route comes back on its own, so there's nothing to run.</p>\n</div>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Notes for Mac users</h3>\n\n<p style=\"margin: 0 0 14px;\">You can use a Mac, but plan to borrow a teammate's Windows laptop for console and FTP steps.</p>\n\n<div style=\"margin: 12px 0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">macOS differences</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 30%;\" scope=\"col\">Task</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">macOS</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Console connection</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">No PuTTY. Use the Terminal command <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">screen /dev/tty.usbserial-[ID] 115200</code>. Some console cables need a driver from their maker.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Internet over Wi-Fi</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">In System Settings, Network, use <kbd style=\"display: inline-block; padding: 1px 6px; border: 1px solid #cbd5e1; border-bottom-width: 3px; border-radius: 4px; background-color: #e2e8f0; color: #0f172a; font-family: inherit; font-size: 0.9em; line-height: 1.4;\">Set Service Order</kbd> to drag Wi-Fi above your Ethernet adapter. Drag it back to undo.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Add the lab route</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">sudo route -n add -net 10.0.0.0/8 10.<span style=\"color: #b45309; font-weight: 700;\">R</span>.20.254</code>, using the gateway for the VLAN you are on from your addressing plan</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Remove the lab route</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">sudo route -n delete -net 10.0.0.0/8</code>, or restart</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Testing from the internet</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Unplug Ethernet, then join <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">CyberHub-Internet</code></td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>FTP login in Cyber Hub 09</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">macOS no longer includes an FTP command. Use a Windows teammate's laptop.</td>\n</tr>\n</tbody>\n</table>\n</div>\n</div>"},{"slug":"troubleshooting","title":"Troubleshooting","html":"<div id=\"dp-wrapper\" style=\"padding: 24px; border: 1px solid #e2e8f0; border-radius: 8px; background-color: #f8fafc; color: #334155; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6;\">\n<h3 style=\"margin: 0 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Overview</h3>\n\n<p style=\"margin: 0 0 20px; color: #1e293b; font-size: 1.125em; line-height: 1.55;\">Expect things to break this semester. Finding and fixing problems is a core part of the work, not a sign that something went wrong. This page covers how to approach a problem, how to track it down, when to ask for help, and where AI fits.</p>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">The mindset</h3>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #0055ff; border-radius: 4px; background-color: #f0f4ff;\">\n<p style=\"margin: 0; color: #0033aa; font-weight: 700;\">Note: Problems are part of the job</p>\n<ul style=\"margin: 6px 0 0 20px; padding-left: 0; list-style-type: square; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">\n<li style=\"margin-bottom: 4px;\">Every engineer misconfigures a device, uses the wrong port or locks themselves out at some point.</li>\n<li style=\"margin-bottom: 4px;\">Employers value people who can find the cause, not people who never run into problems.</li>\n</ul>\n</div>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #00aa66; border-radius: 4px; background-color: #f2faf5;\">\n<p style=\"margin: 0; color: #006633; font-weight: 700;\">Tip: Every result is evidence</p>\n<ul style=\"margin: 6px 0 0 20px; padding-left: 0; list-style-type: square; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">\n<li style=\"margin-bottom: 4px;\">Every error message and failed ping is a clue that rules something out.</li>\n<li style=\"margin-bottom: 4px;\">Each one you rule out brings you closer to the cause.</li>\n</ul>\n</div>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #00aa66; border-radius: 4px; background-color: #f2faf5;\">\n<p style=\"margin: 0; color: #006633; font-weight: 700;\">Tip: Take a break when you're stuck</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">Step away for a few minutes, then explain the problem to a teammate from the start. Talking it through often reveals the step you skipped.</p>\n</div>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">The method</h3>\n\n<ol style=\"margin: 0 0 16px 20px; padding-left: 0;\">\n<li style=\"margin-bottom: 8px;\"><strong>Describe it exactly.</strong> Not \"the internet is broken\" but \"laptop on XG10 gets no address.\"</li>\n<li style=\"margin-bottom: 8px;\"><strong>Read the error.</strong> Messages like \"Destination host unreachable\" tell you where to look.</li>\n<li style=\"margin-bottom: 8px;\"><strong>Narrow it down.</strong> One device or all of them? Did it ever work? What changed since then?</li>\n<li style=\"margin-bottom: 8px;\"><strong>Check from the bottom up,</strong> using the layer table below.</li>\n<li style=\"margin-bottom: 8px;\"><strong>Change one thing at a time,</strong> and test after each change, or you won't know what fixed it.</li>\n<li style=\"margin-bottom: 8px;\"><strong>Write it down.</strong> Open a troubleshooting ticket in the Team Log: the issue, a work log entry for each hypothesis you test (keep the ones you rule out), the resolution and the verification. The next person solves it faster.</li>\n</ol>\n\n<div style=\"margin: 12px 0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">Check layer by layer, from the bottom</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 25%;\" scope=\"col\">Layer</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Check</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>1 Physical</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Link lights, cables seated, the right port on the right device</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>2 Data link</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">VLAN membership, trunk settings, the MAC address table</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>3 Network</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Address and mask, default gateway, routing tables</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>4 to 7 Application</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Firewall policies, service status, ports</td>\n</tr>\n</tbody>\n</table>\n</div>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Tips and tricks</h3>\n\n<div style=\"margin: 0 0 24px; padding: 14px 16px; border: 1px solid #cbd5e1; border-left: 5px solid #003366; border-radius: 4px; background-color: #ffffff;\">\n<p style=\"margin: 0 0 8px; color: #003366; font-weight: 700;\">Habits that save time</p>\n<ul style=\"margin: 0; padding-left: 0; list-style-type: none; color: #1e293b; font-size: 0.95em;\">\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span>Check the cable first. A cable in the wrong port is one of the most common causes.</li>\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span>Ping in both directions. A reply that can't get back fails just like a request that can't get there.</li>\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span>Look before you change. Read the current settings before you edit anything.</li>\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span>Check your network diagram. A port, VLAN or address that differs between the diagram and the rack is often the fault.</li>\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span>Compare with something that works: another port, another laptop, or a neighboring team's settings.</li>\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span>Undo your last change. If that fixes it, you have found the cause.</li>\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span>Save the configuration. \"Worked last week, broken today\" is usually an unsaved change.</li>\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span>Don't rely on a reboot. A restart can hide the cause until it returns at a worse time.</li>\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span>Screenshot the error. You will want the exact wording later, for the Team Log or a ticket.</li>\n</ul>\n</div>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Common symptoms</h3>\n\n<div style=\"margin: 12px 0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">Symptoms and likely causes</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 45%;\" scope=\"col\">Symptom</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Probable cause</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Device gets a <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">169.254.x.x</code> address</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Port in the wrong VLAN, or that VLAN has no DHCP pool</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Has an address but can't ping its own gateway</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Missing SVI, or a typo in a static address</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Pings its own gateway but not other VLANs</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Wrong default gateway on the device</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Proxmox web page stops loading after a trunk change</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">XG3's untagged VLAN is not the Management VLAN</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Proxmox host works but a VM can't be reached</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">VM tag missing or wrong, VLAN not tagged on XG3, or the bridge isn't VLAN-aware</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Internal VLANs reach each other but not the firewall</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Switch default route missing, or the firewall has no route back to that subnet</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Internal networks can't reach the DMZ</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">No firewall policy from that network to the DMZ</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Lab works but the internet doesn't</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Laptop route setup, on <strong><a style=\"color: #003366; text-decoration: underline; font-weight: bold;\" href=\"#ref/lab-access-and-laptop-setup\">Reference: Lab Access and Laptop Setup</a></strong></td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Laptop on CyberHub-Internet reaches nothing</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Ethernet is still plugged in, so the lab route sends traffic to your own rack. See Testing from the internet, on <strong><a style=\"color: #003366; text-decoration: underline; font-weight: bold;\" href=\"#ref/lab-access-and-laptop-setup\">Reference: Lab Access and Laptop Setup</a></strong></td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>apt update fails on a VM or the Pi</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Its DNS server isn't <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">203.0.113.10</code>, <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">DMZ_to_Repo</code> is missing (DMZ VMs), or its sources still point at Ubuntu's or Raspberry Pi's own servers</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>A device can't resolve names or keeps the wrong time</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Its DNS or time server isn't <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">203.0.113.10</code>, or <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">Upstream_Services</code> doesn't cover its subnet</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Proxmox storage is unavailable and VMs won't start</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">The NAS was powered on after the Proxmox host</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Worked last week, broken today</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Configuration wasn't saved to startup</td>\n</tr>\n</tbody>\n</table>\n</div>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Getting help</h3>\n\n<p style=\"margin: 0 0 14px;\">Solve problems at the lowest tier you can before moving up.</p>\n\n<div style=\"margin: 12px 0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">Escalation tiers</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 10%;\" scope=\"col\">Tier</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Contact</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Escalate when</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>1</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Your team</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Troubleshoot together for 15 minutes</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>2</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Other teams</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Ask a neighboring team; teams that are ahead are expected to help</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>3</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Instructional aide</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Hardware problems or unclear instructions</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>4</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Instructor</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Problems nobody else can solve, or infrastructure failures</td>\n</tr>\n</tbody>\n</table>\n</div>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #ea580c; border-radius: 4px; background-color: #fff7ed;\">\n<p style=\"margin: 0; color: #c2410c; font-weight: 700;\">Caution: Prepare a ticket for Tier 3 or 4</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">Write these in the Team Log first. Teams often find the problem while gathering them.</p><ul style=\"margin: 6px 0 0 20px; padding-left: 0; list-style-type: square; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">\n<li style=\"margin-bottom: 4px;\">The symptom, and what you already checked.</li>\n<li style=\"margin-bottom: 4px;\">For network problems: the VLAN table, port settings, switch addresses, routing table and DHCP bindings.</li>\n</ul>\n</div>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Using AI</h3>\n\n<p style=\"margin: 0 0 14px;\">AI tools can help, but only as a last step. Work through the method, the symptom table and your team first. Troubleshooting is the skill this course builds, and an answer you didn't work for will not help you at the checkpoint or in an interview.</p>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #ea580c; border-radius: 4px; background-color: #fff7ed;\">\n<p style=\"margin: 0; color: #c2410c; font-weight: 700;\">Caution: Before you ask AI</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">You should already be able to answer all of these:</p><ul style=\"margin: 6px 0 0 20px; padding-left: 0; list-style-type: square; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">\n<li style=\"margin-bottom: 4px;\">What exactly is the symptom, and what does the error say?</li>\n<li style=\"margin-bottom: 4px;\">Which layers have you checked, and what did you find?</li>\n<li style=\"margin-bottom: 4px;\">What changed since it last worked?</li>\n</ul>\n</div>\n\n<div style=\"margin: 0 0 24px; padding: 14px 16px; border: 1px solid #cbd5e1; border-left: 5px solid #003366; border-radius: 4px; background-color: #ffffff;\">\n<p style=\"margin: 0 0 8px; color: #003366; font-weight: 700;\">Guidelines for using AI</p>\n<ul style=\"margin: 0; padding-left: 0; list-style-type: none; color: #1e293b; font-size: 0.95em;\">\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span>Describe your own diagnosis and ask what you might have missed, not just for the fix.</li>\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span>Never paste passwords, keys or configurations that contain them.</li>\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span>Check every suggestion against your addressing plan and the device before you apply it.</li>\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span>Apply one change at a time and test after each, as in the method.</li>\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span>Record in the Team Log what you asked, what it suggested and what actually fixed it.</li>\n</ul>\n</div>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #0055ff; border-radius: 4px; background-color: #f0f4ff;\">\n<p style=\"margin: 0; color: #0033aa; font-weight: 700;\">Note: Be ready to explain the fix</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">Any team member may be asked to explain it at the checkpoint. If you can't explain why a fix works, you haven't finished troubleshooting.</p>\n</div>\n</div>"},{"slug":"lab-rules-and-safety","title":"Lab Rules and Safety","html":"<div id=\"dp-wrapper\" style=\"padding: 24px; border: 1px solid #e2e8f0; border-radius: 8px; background-color: #f8fafc; color: #334155; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6;\">\n<h3 style=\"margin: 0 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Overview</h3>\n\n<p style=\"margin: 0 0 20px; color: #1e293b; font-size: 1.125em; line-height: 1.55;\">These safety and engagement rules apply in every lab. Breaking them can damage equipment, harm someone, or put another team's work at risk.</p>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Lab safety</h3>\n\n<ul style=\"margin: 0 0 16px 20px; padding-left: 0; list-style-type: square;\">\n<li style=\"margin-bottom: 8px;\">Servers are heavy. Two people slide a server in or out of the rack.</li>\n<li style=\"margin-bottom: 8px;\">Lab devices never connect to campus Wi-Fi. Software comes from your provider's repository.</li>\n<li style=\"margin-bottom: 8px;\">Connect your rack only to its own uplink jack. Never connect it to another rack or the campus network.</li>\n<li style=\"margin-bottom: 8px;\">From CyberHub-Internet, touch only your own rack's WAN address, or your target's during Cyber Hub 12. The instructor rack logs everything that crosses it.</li>\n<li style=\"margin-bottom: 8px;\">Follow the shutdown steps in <strong><a style=\"color: #003366; text-decoration: underline; font-weight: bold;\" href=\"#ref/startup-and-shutdown\">Reference: Startup and Shutdown</a></strong> at the end of every lab.</li>\n</ul>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #b91c1c; border-radius: 4px; background-color: #fef2f2;\">\n<p style=\"margin: 0; color: #991b1b; font-weight: 700;\">Danger: Never connect Hak5 devices</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">The Hak5 tools may carry live payloads. Never plug one into a laptop, a rack or any other device. Only the instructor runs them, on equipment set aside for demonstrations.</p>\n</div>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Rules of engagement for Cyber Hub 12</h3>\n\n<p style=\"margin: 0 0 14px;\">Scanning another team's network is only acceptable within these rules. Both teams agree to them in writing in their Team Logs before any scan starts.</p>\n\n<ul style=\"margin: 0 0 16px 20px; padding-left: 0; list-style-type: square;\">\n<li style=\"margin-bottom: 8px;\"><strong>Scope:</strong> only the target team's Data and DMZ subnets, from its Data port, and its firewall's WAN address, from CyberHub-Internet.</li>\n<li style=\"margin-bottom: 8px;\"><strong>Allowed:</strong> discovery with Nmap, vulnerability scanning with the assessors' own scanner appliance hosted by the target team, and checking findings by hand without changing anything.</li>\n<li style=\"margin-bottom: 8px;\"><strong>Not allowed:</strong> changing any setting, logging in with found credentials, denial-of-service tests, or touching any device outside the scope.</li>\n<li style=\"margin-bottom: 8px;\"><strong>Timing:</strong> only during the agreed lab session, with the target team present.</li>\n<li style=\"margin-bottom: 8px;\"><strong>Stop:</strong> if anything breaks or looks wrong, stop scanning and tell the target team and the instructor.</li>\n<li style=\"margin-bottom: 8px;\"><strong>Offboarding:</strong> once the assessors have exported their results, the target team deletes the hosted appliance and its temporary firewall policy.</li>\n</ul>\n</div>"},{"slug":"startup-and-shutdown","title":"Startup and Shutdown","html":"<div id=\"dp-wrapper\" style=\"padding: 24px; border: 1px solid #e2e8f0; border-radius: 8px; background-color: #f8fafc; color: #334155; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6;\">\n<h3 style=\"margin: 0 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Overview</h3>\n\n<p style=\"margin: 0 0 20px; color: #1e293b; font-size: 1.125em; line-height: 1.55;\">How to bring the rack up at the start of a lab and shut it down safely at the end. A clean shutdown protects your work and the equipment.</p>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Powering up</h3>\n\n<p style=\"margin: 0 0 14px;\">Power on only what the day's lab needs. Working out why something won't turn on is part of the job.</p>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #00aa66; border-radius: 4px; background-color: #f2faf5;\">\n<p style=\"margin: 0; color: #006633; font-weight: 700;\">Tip: Start the NAS before Proxmox</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">Proxmox keeps its VM disks on the NAS. If the host starts first, the storage shows as unavailable and the VMs won't start.</p>\n</div>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #0055ff; border-radius: 4px; background-color: #f0f4ff;\">\n<p style=\"margin: 0; color: #0033aa; font-weight: 700;\">Note: Check the clock</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">Your firewall, switch and Proxmox host take their time from <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">203.0.113.10</code>. If a clock is wrong, check that device's time server setting before a lab that relies on logs, such as Cyber Hub 12.</p>\n</div>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Shutting down</h3>\n\n<p style=\"margin: 0 0 14px;\">Follow this order at the end of every lab:</p>\n\n<ol style=\"margin: 0 0 16px 20px; padding-left: 0;\">\n<li style=\"margin-bottom: 8px;\">Save the configuration on the switch and the firewall.</li>\n<li style=\"margin-bottom: 8px;\">Log in to the Proxmox web interface and shut down every running VM.</li>\n<li style=\"margin-bottom: 8px;\">Shut down the Proxmox host from its web interface or with its shutdown command.</li>\n<li style=\"margin-bottom: 8px;\">Shut down the NAS from DSM (Power, then Shut Down).</li>\n<li style=\"margin-bottom: 8px;\">Shut down any running Raspberry Pi with <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">sudo shutdown -h now</code>.</li>\n<li style=\"margin-bottom: 8px;\">Turn off the KVM console, fold it, and slide it into the rack.</li>\n<li style=\"margin-bottom: 8px;\">Power off the UPS by holding its power button.</li>\n<li style=\"margin-bottom: 8px;\">Unplug the UPS from the wall outlet.</li>\n<li style=\"margin-bottom: 8px;\">Return every cable, adapter and USB stick to the Utility Drawer.</li>\n<li style=\"margin-bottom: 8px;\">Call the instructor to check your rack.</li>\n</ol>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #ea580c; border-radius: 4px; background-color: #fff7ed;\">\n<p style=\"margin: 0; color: #c2410c; font-weight: 700;\">Caution: Follow this order</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">Turning the UPS off cuts power to everything at once. Anything still running at that point, especially the NAS and Proxmox, can lose data.</p>\n</div>\n</div>"},{"slug":"credits-and-release-notes","title":"Credits and Release Notes","html":"<div id=\"dp-wrapper\" style=\"padding: 24px; border: 1px solid #e2e8f0; border-radius: 8px; background-color: #f8fafc; color: #334155; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6;\">\n<h3 style=\"margin: 0 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Overview</h3>\n\n<p style=\"margin: 0 0 20px; color: #1e293b; font-size: 1.125em; line-height: 1.55;\">The team behind Cyber Hub, and every change made to these pages.</p>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Credits</h3>\n\n<div style=\"margin: 12px 0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">Credits</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 25%;\" scope=\"col\">Name</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top
