<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Builder</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23003366%22%2F%3E%3Cpath%20d%3D%22M32%209%2051%2016v15c0%2012-8%2020-19%2024-11-4-19-12-19-24V16z%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%224%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cg%20fill%3D%22%23fff%22%3E%3Crect%20x%3D%2222%22%20y%3D%2222%22%20width%3D%2220%22%20height%3D%225%22%20rx%3D%221.5%22%2F%3E%3Crect%20x%3D%2222%22%20y%3D%2230%22%20width%3D%2220%22%20height%3D%225%22%20rx%3D%221.5%22%2F%3E%3Crect%20x%3D%2222%22%20y%3D%2238%22%20width%3D%2220%22%20height%3D%225%22%20rx%3D%221.5%22%2F%3E%3C%2Fg%3E%3Cg%20fill%3D%22%23f59e0b%22%3E%3Ccircle%20cx%3D%2237.5%22%20cy%3D%2224.5%22%20r%3D%221.4%22%2F%3E%3Ccircle%20cx%3D%2237.5%22%20cy%3D%2232.5%22%20r%3D%221.4%22%2F%3E%3Ccircle%20cx%3D%2237.5%22%20cy%3D%2240.5%22%20r%3D%221.4%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E"><style>/* Report Builder. Same shell and palette as the Network Diagram app: top bar, section rail, work area, editor panel. Light only. */
:root{--navy:#003366;--navy2:#00264d;--ink:#0f172a;--body:#334155;--muted:#64748b;--border:#cbd5e1;--hair:#e2e8f0;--page:#f8fafc;--card:#fff;--soft:#f1f5f9;
 --sel:#2563eb;--ok:#15803d;--okbg:#f0fdf4;--warn:#b45309;--warnbg:#fffbeb;--err:#b91c1c;--errbg:#fef2f2;
 --crit:#7f1d1d;--high:#b91c1c;--med:#b45309;--low:#1d4ed8;--none:#64748b;
 --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:light}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 var(--sans);color:var(--body);background:var(--page);display:flex;flex-direction:column}
button{font:inherit;color:var(--body);background:#fff;border:1px solid var(--border);border-radius:6px;padding:6px 11px;cursor:pointer}
button:hover{background:var(--soft)}
button.primary{background:var(--navy);border-color:var(--navy);color:#fff}
button.primary:hover{background:var(--navy2)}
button.danger{color:var(--err);border-color:#fecaca}
button.small{padding:3px 8px;font-size:12.5px}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--soft)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);border:1px solid var(--border);border-radius:5px;padding:6px 8px;background:#fff;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.45;min-height:38px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin:0 0 4px}
.req{color:var(--err)}
.hintline{font-size:12px;color:var(--muted);margin:4px 0 0}
code{font:12.5px var(--mono)}

.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:#fff;border-bottom:1px solid var(--border)}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{color:var(--navy);font-size:16px}
.brand small{color:var(--muted);font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 16px}
.seg button[aria-selected=true]{background:var(--navy);color:#fff}
.who{display:flex;align-items:center;gap:6px;margin:0;font-weight:400;color:var(--muted);font-size:12.5px}
.who select{width:auto;max-width:170px}
.acts{display:flex;gap:6px;margin-left:auto;align-items:center}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.12);padding:5px;z-index:30;min-width:230px;display:flex;flex-direction:column}
.menu-list button{border:0;text-align:left;border-radius:5px}
.menu-list hr{border:0;border-top:1px solid var(--hair);margin:4px 0}

.savebar{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));font-size:12.5px;color:var(--muted);background:var(--page);border-bottom:1px solid var(--hair)}
.savebar.bad{background:var(--errbg);color:var(--err)}
.savebar button{padding:2px 8px;font-size:12px}
.bk{display:inline-flex;align-items:center;gap:6px}
.bk i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.bk.ok i{background:var(--ok)} .bk.amber{color:var(--warn)} .bk.amber i{background:var(--warn)} .bk.red{color:var(--err);font-weight:600} .bk.red i{background:var(--err)}

.main{flex:1;display:flex;min-height:0}
.rail{width:236px;flex:none;border-right:1px solid var(--border);background:#fff;padding:12px 8px 30px;overflow:auto}
.rail h3{font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 10px 8px}
.rail h3:first-child{margin-top:4px}
.step{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:center;width:100%;text-align:left;border:0;border-radius:6px;padding:6px 8px;background:transparent}
.step:hover{background:var(--soft)}
.step[aria-current=true]{background:#eef4fb}
.step .n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;font:600 10.5px/1 var(--mono);color:var(--muted);background:#fff}
.step[aria-current=true] .n{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--navy)}
.step b{display:block;color:var(--ink);font-weight:600;font-size:13px;line-height:1.25}
.step small{display:block;color:#475569;font-size:11.5px}

.work{flex:1;min-width:0;overflow:auto;padding:20px 26px 60px}
.work > *{max-width:880px}
.work h2{font-size:18px;color:var(--navy);margin:0 0 4px}
.work h3{font-size:14.5px;color:var(--ink);margin:22px 0 8px}
.sub{margin:0 0 16px;color:var(--muted);font-size:13px;max-width:72ch}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 18px}
.grid2 .wide{grid-column:1/-1}
.field{margin:0 0 12px;min-width:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;align-items:center}
.note{border-left:3px solid var(--navy);background:#eef4fb;padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px;margin:0 0 14px;color:var(--ink)}
.note.warn{border-color:var(--warn);background:var(--warnbg)}
.note.ok{border-color:var(--ok);background:var(--okbg)}
.empty{color:var(--muted);font-size:13px;padding:18px;border:1.5px dashed var(--border);border-radius:10px;text-align:center;background:#fff}

.tablewrap{margin:0 0 14px}
.tbox{border:1px solid var(--border);border-radius:9px;overflow-x:auto;background:#fff;margin:0 0 6px}
table.edit{border-collapse:collapse;width:100%;font-size:13px}
table.edit th{background:var(--soft);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
table.edit td{padding:4px 5px;border-bottom:1px solid var(--hair);vertical-align:top;min-width:90px}
table.edit tr:last-child td{border-bottom:0}
table.edit td input,table.edit td textarea,table.edit td select{border-color:transparent;background:transparent;padding:5px 6px}
table.edit td input:hover,table.edit td textarea:hover{border-color:var(--hair)}
table.edit td input:focus,table.edit td textarea:focus{border-color:var(--border);background:#fff}
table.edit td.mono input,table.edit td.mono{font-family:var(--mono);font-size:12.5px}
table.edit .rowacts{width:34px;min-width:34px;text-align:center}
table.edit .fixed{display:block;padding:5px 6px;color:var(--ink)}
table.edit td.ref-col .fixed{color:var(--muted);font-size:12.5px;min-width:180px}
table.edit td.pattern .fixed{font-family:var(--mono);color:var(--muted);font-size:12.5px}

.well{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1.5px dashed var(--border);border-radius:9px;padding:8px;background:var(--page);min-height:56px}
.well.over{border-color:var(--sel);background:#eff6ff}
.thumb{position:relative;margin:0;width:120px;height:80px;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:#fff}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:2px;right:2px;background:rgba(255,255,255,.92);padding:0 6px}
.thumb .missing{display:grid;place-items:center;height:100%;font-size:11px;color:var(--err)}
.wellhint{font-size:12px;color:var(--muted)}

.qa{border-top:1px solid var(--hair);padding-top:10px;margin-top:10px}
.qa:first-of-type{border-top:0;margin-top:0;padding-top:0}
.qa p.q{margin:0 0 6px;color:var(--ink);font-weight:600}
.deliv{border:1px solid var(--border);border-radius:9px;margin:0 0 12px;overflow:hidden;background:#fff}
.deliv header{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--navy);color:#fff;padding:10px 18px}
.deliv header b{font-size:13.5px}
.deliv header span{font-size:11px;background:#fff;color:var(--navy);border-radius:4px;padding:1px 7px;font-weight:600}
.deliv .in{padding:14px 18px 16px}
.deliv .in p{margin:0 0 8px;font-size:13px}
.checks{margin:0 0 10px;padding:0;list-style:none;font-size:12.5px;color:var(--muted)}
.checks li::before{content:"✓ ";color:var(--ok)}

.tally{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.tally span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px;font-variant-numeric:tabular-nums}
.tally i{width:8px;height:8px;border-radius:50%}
.flist{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:9px;padding:9px 12px;cursor:pointer;text-align:left;width:100%}
.frow:hover{border-color:#94a3b8;background:#fff}
.frow[aria-current=true]{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.frow .t{display:block;color:var(--ink);font-weight:600}
.frow .m{display:block;color:var(--muted);font-size:12.5px}
.frow.dim{opacity:.6}
.sev{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border-radius:7px;color:#fff;padding:5px 0;width:64px;font-variant-numeric:tabular-nums;line-height:1.1}
.sev b{font:600 15px/1 var(--mono)}
.sev small{font-size:10px;letter-spacing:.04em;text-transform:uppercase;margin-top:3px}
.sev.mini{width:auto;padding:2px 7px;flex-direction:row;gap:5px;border-radius:5px}
.sev.mini b{font-size:12px}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;border:1px solid var(--border);white-space:nowrap;color:var(--muted);background:#fff}
.pill.confirmed{color:var(--ok);border-color:#86efac;background:var(--okbg)}
.pill.false-positive{text-decoration:line-through}
.pill.not-verified{color:var(--warn);border-color:#fcd34d;background:var(--warnbg)}
.pill.new{color:var(--sel);border-color:#bfdbfe;background:#eff6ff}

.panel{width:460px;flex:none;border-left:1px solid var(--border);background:#fff;overflow:auto;padding:16px 18px 60px}
.panel h2{font-size:16px;color:var(--navy);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:12.5px;background:#fff}
.chip[aria-pressed=true]{background:#eef4fb;border-color:var(--navy);color:var(--navy);font-weight:600}
.chip code{font-size:11.5px}
.cvss{border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:var(--page)}
.cvss-head{display:flex;align-items:center;gap:12px;margin:0 0 8px}
.cvss-head code{color:var(--muted);word-break:break-all;font-size:11.5px}
.metric{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px;align-items:center;margin:4px 0}
.metric span{font-size:12px}
.opts{display:flex;flex-wrap:wrap;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:#fff;width:max-content;max-width:100%}
.opts button{border:0;border-right:1px solid var(--hair);border-radius:0;padding:4px 9px;font-size:12px}
.opts button:last-child{border-right:0}
.opts button[aria-pressed=true]{background:var(--navy);color:#fff}
.seg3{display:flex;gap:6px;flex-wrap:wrap}
.seg3 button[aria-pressed=true]{border-color:var(--navy);background:#eef4fb;color:var(--navy);font-weight:600}
.ref{font-size:12px;color:var(--muted);background:var(--soft);border-radius:6px;padding:8px 10px;margin:6px 0 0;white-space:pre-wrap;max-height:180px;overflow:auto}

.ctrl{border:1px solid var(--border);border-radius:9px;background:#fff;margin:0 0 12px;padding:12px 14px}
.ctrl h3{margin:0 0 2px;font-size:14px;color:var(--navy)}
.ctrl .rq{margin:0 0 8px;font-size:13px;color:var(--ink)}
.missing-list{margin:0 0 14px;padding-left:18px;font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:60;max-width:min(560px,calc(100vw - 32px));box-shadow:0 8px 24px rgba(15,23,42,.25)}
.toast.bad{background:var(--err)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{max-width:560px;width:100%;max-height:85vh;overflow:auto;margin:0}
.modal h2{margin:0 0 10px;font-size:17px;color:var(--navy)}
.modal p{margin:0 0 10px}
.m-acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}
.hist{list-style:none;margin:0;padding:0;max-height:50vh;overflow:auto}
.hist li{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--hair);padding:7px 0;font-size:13px}

#print{display:none}
#dframe{flex:1;border:0;width:100%;min-height:0;background:#fff}
#dframe.offstage{position:absolute;left:-20000px;top:0;width:1400px;height:900px;visibility:hidden;flex:none}
.main.diagram{overflow:hidden}
@media (max-width:900px){.main.diagram{min-height:calc(100vh - 120px)}}

@media (max-width:1150px){.panel{width:400px}}
@media (max-width:900px){
 .main{flex-direction:column;overflow:auto}
 .rail{width:auto;border-right:0;border-bottom:1px solid var(--border);display:flex;gap:4px;overflow-x:auto;padding:8px}
 .rail h3{display:none}
 .step{width:auto;flex:none}
 .step small{display:none}
 .work,.panel{overflow:visible}
 .work{padding:16px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
 .panel{width:auto;border-left:0;border-top:1px solid var(--border)}
 .grid2{grid-template-columns:minmax(0,1fr)}
 .acts{margin-left:0}
}

/* ------------------------------------------------ printed documents
   Same tokens and components as the Canvas pages (cyber-hub components.py, canvas-style-guide.html):
   navy section headings over a hairline rule, navy table headers with zebra rows, deliverable-style cards. */
.doc{--ink:#0f172a;--head:#1e293b;--body:#334155;--muted:#64748b;--border:#cbd5e1;--hair:#e2e8f0;--zebra:#f1f5f9;--check:#006633;
 font:10.5pt/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--body);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc .page{break-after:page}
.doc .cov{min-height:9.2in;display:flex;flex-direction:column}
.doc .cov .band{height:10pt;background:var(--navy);margin:0 0 .5in}
.doc .cov .logos{display:flex;justify-content:space-between;align-items:center;min-height:1.4in;margin-bottom:.9in}
.doc .cov .logos img{max-height:1.4in;max-width:3in}
.doc .cov .kick{font-weight:700;font-size:9pt;letter-spacing:.12em;color:var(--navy);text-transform:uppercase}
.doc .cov h1{font-size:30pt;line-height:1.1;margin:8pt 0 10pt;color:var(--navy)}
.doc .cov .for{font-size:15pt;color:var(--head);margin:0 0 28pt}
.doc .cov dl{display:grid;grid-template-columns:1.6in 1fr;gap:6pt 12pt;font-size:10.5pt;margin:0;border-top:2pt solid var(--hair);padding-top:14pt}
.doc .cov dt{color:var(--navy);font-weight:700} .doc .cov dd{margin:0;color:var(--body)}
.doc .cov .conf{margin-top:auto;font-size:9pt;color:var(--muted);border-top:1pt solid var(--hair);padding-top:8pt}
.doc .runhead{font-weight:700;font-size:8.5pt;letter-spacing:.12em;color:var(--navy);text-transform:uppercase;margin:0 0 4pt}
.doc h1.s{font-size:15pt;line-height:1.3;color:var(--navy);margin:22pt 0 10pt;padding-bottom:4pt;border-bottom:2pt solid var(--hair);break-after:avoid}
.doc h2.s{font-size:12pt;color:var(--head);margin:14pt 0 6pt;break-after:avoid}
.doc h3.s{font-size:11pt;color:var(--navy);margin:12pt 0 4pt;break-after:avoid}
.doc p{margin:0 0 7pt;white-space:pre-wrap}
.doc ol,.doc ul{margin:0 0 8pt;padding-left:18pt}
.doc .blank{color:var(--muted);font-style:italic}
.doc table{border-collapse:collapse;width:100%;margin:4pt 0 12pt;font-size:9.5pt;background:#fff;break-inside:auto}
.doc tr{break-inside:avoid}
.doc th,.doc td{border:.75pt solid var(--border);padding:5pt 7pt;text-align:left;vertical-align:top}
.doc thead th{background:var(--navy);color:#fff;font-weight:600}
.doc tbody tr:nth-child(even) td{background:var(--zebra)}
.doc table.form th{background:var(--zebra);color:var(--navy);font-weight:700;width:1.9in}
.doc table.form tbody tr:nth-child(even) td{background:#fff}
.doc td.mono,.doc code{font-family:Consolas,Menlo,Monaco,"Courier New",monospace;font-size:9pt;color:var(--ink)}
.doc .sevtag{display:inline-block;color:#fff;border-radius:3pt;padding:1pt 6pt;font-weight:700;font-size:8.5pt;white-space:nowrap}
.doc .card{border:1pt solid var(--border);border-radius:5pt;margin:0 0 12pt;overflow:hidden;break-inside:avoid-page;background:#fff}
.doc .card .ch{display:flex;gap:10pt;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;padding:6pt 10pt}
.doc .card .ch b{font-size:11pt}
.doc .card .ch .tag{background:#fff;color:var(--navy);border-radius:3pt;padding:1pt 6pt;font-size:8pt;font-weight:700;white-space:nowrap}
.doc .card .ch code{color:#cbd5e1;font-size:8pt;display:block;margin-top:1pt}
.doc .card .cb{padding:8pt 10pt}
.doc .card table{margin:0;border:0}
.doc .card table th{width:1.6in;border-left:0}
.doc .card table td{border-right:0}
.doc .card tr:first-child th,.doc .card tr:first-child td{border-top:0}
.doc .card tr:last-child th,.doc .card tr:last-child td{border-bottom:0}
.doc .card figure{margin:8pt 10pt}
.doc figure{margin:6pt 0 12pt;break-inside:avoid}
.doc figure img{display:block;max-width:100%;max-height:6.5in;border:1pt solid var(--border);border-radius:4pt}
.doc figcaption{font-size:8.5pt;color:var(--muted);margin-top:3pt}
.doc .bar5{display:flex;height:8pt;border-radius:4pt;overflow:hidden;margin:4pt 0 12pt;background:var(--zebra)}
.doc .counts th,.doc .counts td{text-align:center;width:20%}
.doc .counts td{font-size:16pt;font-weight:700;color:var(--ink);background:#fff!important}
.doc .counts thead th{border-top-width:4pt}

.signname{font-weight:600}

.signdate{font-size:12px;color:var(--ok);font-weight:600}

.plist{display:flex;flex-direction:column;gap:10px;margin:0 0 14px;align-items:flex-start}

.pcard.resolved .pcard-h{background:#1f5f3a}

#backup{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}

.bkwarn.red{border-color:#b91c1c;background:#fef2f2;color:#991b1b}

.bkwarn{border-color:#b91c1c;background:#fef2f2;color:#991b1b}

}

const REFS = [{"slug":"skills-and-learning-outcomes","title":"Skills and Learning Outcomes","html":"<div id=\"dp-wrapper\" style=\"padding: 24px; border: 1px solid #e2e8f0; border-radius: 8px; background-color: #f8fafc; color: #334155; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6;\">\n<h3 style=\"margin: 0 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Overview</h3>\n\n<p style=\"margin: 0 0 20px; color: #1e293b; font-size: 1.125em; line-height: 1.55;\">By the end of Cyber Hub 1.0 your team will have built, assessed and defended a small business network. This page lists what you will be able to do, and how to say it on a resume.</p>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Learning outcomes</h3>\n\n<div style=\"margin: 12px 0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">Learning outcomes</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 45%;\" scope=\"col\">Outcome</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Practiced in</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">CySA+ domain</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Safely remove, install and cable rack-mounted servers</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Cyber Hub 00</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">None</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Segment a network with VLANs, routing between VLANs and DHCP</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Cyber Hubs 04 and 05</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">1 Security Operations</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Configure a perimeter firewall: interfaces, routes, NAT, port forwarding and least-privilege policies</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Cyber Hubs 02 and 03</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">1 Security Operations</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Isolate public servers in a DMZ and untrusted devices on a guest network</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Cyber Hubs 03 and 08</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">1 Security Operations</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Run virtual machines on a hypervisor with shared network storage</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Cyber Hubs 06 and 07</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">1 Security Operations</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Deploy Linux services on an isolated network from an internal package repository</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Cyber Hubs 08, 09 and 11</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">None</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Find cleartext credentials in captured traffic</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Cyber Hub 09</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">1 Security Operations</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Plan and run an authorized vulnerability assessment, and report it</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Cyber Hubs 11 and 12</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">2 Vulnerability Management, 4 Reporting and Communication</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Fix findings, prove the fixes and document risk in an SSP</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Cyber Hub 13</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">2 Vulnerability Management, 4 Reporting and Communication</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Explain a physical threat and its defenses to non-technical leadership</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Cyber Hub 14</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">3 Incident Response and Management, 4 Reporting and Communication</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Decommission equipment so no data or configuration is left behind</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Cyber Hub 15</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">None</td>\n</tr>\n</tbody>\n</table>\n</div>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #0055ff; border-radius: 4px; background-color: #f0f4ff;\">\n<p style=\"margin: 0; color: #0033aa; font-weight: 700;\">Note: How this maps to CySA+</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">The domains come from the CompTIA CySA+ exam (CS0-004). Cyber Hub gives you the most practice in Vulnerability Management and in Reporting and Communication. Security Operations and Incident Response are covered in more depth in the remaining coursework.</p>\n</div>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Tools you will use</h3>\n\n<div style=\"margin: 12px 0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">Tools and platforms</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 25%;\" scope=\"col\">Area</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Tools</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Networking</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Cisco CBS350 switches, Fortinet FortiGate and FortiWiFi (FortiOS)</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Servers</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Proxmox VE, Synology DSM, Ubuntu Server, Raspberry Pi OS, Apache, vsftpd</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Security</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Nmap, Greenbone (OpenVAS), Wireshark</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Administration</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">PuTTY, SSH, PowerShell</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Documentation</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Vulnerability Assessment Report, System Security Plan, POA&amp;M</td>\n</tr>\n</tbody>\n</table>\n</div>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Resume skills</h3>\n\n<p style=\"margin: 0 0 14px;\">The work in this course maps directly to skills you can list on a resume. Each one starts with an action and names the tools.</p>\n\n<div style=\"margin: 28px 0 0; padding: 14px 16px; border: 1px solid #cbd5e1; border-left: 5px solid #003366; border-radius: 4px; background-color: #ffffff;\">\n<p style=\"margin: 0 0 8px; color: #003366; font-weight: 700;\">Example resume lines</p>\n<ul style=\"margin: 0; padding-left: 0; list-style-type: none; color: #1e293b; font-size: 0.95em;\">\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span>Designed and deployed a segmented network with five VLANs, inter-VLAN routing and DHCP on Cisco switching.</li>\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span>Configured a Fortinet perimeter firewall with NAT, port forwarding, a DMZ and least-privilege policies.</li>\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span>Deployed Linux web and file servers on a Proxmox hypervisor with NFS storage, installed from an internal package repository.</li>\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span>Deployed a Greenbone scanner appliance on Proxmox and ran an authorized vulnerability assessment.</li>\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span>Remediated findings and wrote a System Security Plan with a POA&amp;M.</li>\n<li style=\"margin-bottom: 6px;\"><span style=\"margin-right: 8px; color: #003366; font-weight: 700;\">&#10003;</span>Briefed leadership on physical attack tools and recommended defenses.</li>\n</ul>\n</div>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #ea580c; border-radius: 4px; background-color: #fff7ed;\">\n<p style=\"margin: 0; color: #c2410c; font-weight: 700;\">Caution: List only work you can explain</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">Interviewers will ask about anything on your resume. If a teammate did a task, learn it from them before you list it. Your Team Log records each member's contributions.</p>\n</div>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #00aa66; border-radius: 4px; background-color: #f2faf5;\">\n<p style=\"margin: 0; color: #006633; font-weight: 700;\">Tip: Prepare for interviews</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">Be ready to answer questions like these in your own words:</p><ul style=\"margin: 6px 0 0 20px; padding-left: 0; list-style-type: square; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">\n<li style=\"margin-bottom: 4px;\">What is the difference between an access port and a trunk port?</li>\n<li style=\"margin-bottom: 4px;\">Why does a web server belong in a DMZ?</li>\n<li style=\"margin-bottom: 4px;\">How did you check that a scanner finding was real?</li>\n</ul>\n</div>\n</div>"},{"slug":"the-rack","title":"The Rack","html":"<div id=\"dp-wrapper\" style=\"padding: 24px; border: 1px solid #e2e8f0; border-radius: 8px; background-color: #f8fafc; color: #334155; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6;\">\n<h3 style=\"margin: 0 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Overview</h3>\n\n<p style=\"margin: 0 0 20px; color: #1e293b; font-size: 1.125em; line-height: 1.55;\">Your team will work on an APC NetShelter SX 24U rack. Not every device in it is part of this project: the table shows which ones you will use and what each one does.</p>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #0055ff; border-radius: 4px; background-color: #f0f4ff;\">\n<p style=\"margin: 0; color: #0033aa; font-weight: 700;\">Note: Your team cables the rack</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">Your rack starts with every cable unplugged. Working out what connects where is part of the job, and Cyber Hub 15 returns the rack to this state.</p>\n</div>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Rack Explorer</h3>\n\n<p style=\"margin: 0 0 14px;\">See every device from the front and back, power the rack on, and follow how traffic moves through it. Click any device for details.</p>\n\n<div style=\"margin: 16px 0 24px;\">\n<iframe style=\"display: block; width: 100%; height: 720px; border: 1px solid #cbd5e1; border-radius: 4px;\" src=\"https://glgoltz.github.io/rack-explorer/\" title=\"Rack Explorer\" allowfullscreen=\"allowfullscreen\"></iframe>\n<p style=\"margin: 8px 0 0; color: #64748b; font-size: 0.9em;\">Not loading, or too small? <a style=\"color: #003366; text-decoration: underline;\" href=\"https://glgoltz.github.io/rack-explorer/\" target=\"_blank\" rel=\"noopener\">Open the Rack Explorer in a new tab</a>.</p>\n</div>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Devices</h3>\n\n<div style=\"margin: 12px 0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">Rack devices from top to bottom</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 10%;\" scope=\"col\">U</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Device</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Model</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Purpose</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Top</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">KVM console</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Tripp Lite B040-008-19 (8-port, VGA)</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Screen and keyboard for the servers</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>18</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Legacy server</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Dell PowerEdge R420</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Not used</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>16</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Hypervisor host</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Dell PowerEdge R440</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Proxmox: web server and FTP server VMs</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>14</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Core switch</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Cisco CBS350-12XT</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">VLANs, routing between VLANs, DHCP</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>12</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Secondary switch</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Cisco CBS350-12XT</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Not used</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>10</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Spare firewall</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Fortinet FortiGate 50E</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Not used. The instructor rack is your provider</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>8</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Perimeter firewall</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Fortinet FortiWiFi 60E</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Firewall, DMZ and guest Wi-Fi</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>8</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Retired appliance</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Netgate SG-3100</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Not used</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>6</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Auxiliary server</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Dell PowerEdge R440</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Not used</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>4</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Storage NAS</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Synology RS816</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">RAID 5 storage shared over NFS</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>2</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Component drawer</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">StarTech SLIDESHELFD</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Raspberry Pis, cables, USB sticks</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>1</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">UPS</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Tripp Lite SmartPro</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Battery backup for the whole rack</td>\n</tr>\n</tbody>\n</table>\n</div>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Your provider: the instructor rack</h3>\n\n<p style=\"margin: 0 0 14px;\">Every wall jack in the room leads to the instructor rack, which plays your internet provider. Your rack's uplink jack, labeled with your rack number, connects your firewall's wan1 to it. Its Wi-Fi network, CyberHub-Internet, puts a laptop outside every rack, where a stranger on the internet would be.</p>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">The utility drawer</h3>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #ea580c; border-radius: 4px; background-color: #fff7ed;\">\n<p style=\"margin: 0; color: #c2410c; font-weight: 700;\">Caution: Check the drawer first</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">If anything in the drawer is missing or damaged at the start of lab, tell the instructor before you begin.</p>\n</div>\n\n<div style=\"margin: 12px 0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">Utility drawer contents</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 30%;\" scope=\"col\">Item</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Purpose</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Console cable (blue)</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">USB-to-RJ45 serial cable for the switch and firewall console ports</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Multiport dongle</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">USB-C hub with Ethernet, for laptops without an Ethernet port</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>KVM cable</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Thick USB and VGA cable that connects a server to the KVM console. Handle with care</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>USB Stick A</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Proxmox installer</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>USB Stick B</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Your firewall configuration backups. Software comes from your provider's repository</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Raspberry Pi 3B (VULN-PI)</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">The vulnerable Pi your team builds in Cyber Hub 11</td>\n</tr>\n</tbody>\n</table>\n</div>\n</div>"},{"slug":"rack-schema-and-vlan-plan","title":"Rack Schema and VLAN Plan","html":"<div id=\"dp-wrapper\" style=\"padding: 24px; border: 1px solid #e2e8f0; border-radius: 8px; background-color: #f8fafc; color: #334155; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6;\">\n<h3 style=\"margin: 0 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Overview</h3>\n\n<p style=\"margin: 0 0 20px; color: #1e293b; font-size: 1.125em; line-height: 1.55;\">Every address, VLAN and port in this project follows one plan. Read it before Cyber Hub 02, and return to it whenever two devices can't reach each other.</p>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #0055ff; border-radius: 4px; background-color: #f0f4ff;\">\n<p style=\"margin: 0; color: #0033aa; font-weight: 700;\">Note: How every address is built</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">Every address is <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">10.<span style=\"color: #b45309; font-weight: 700;\">R</span>.VLAN.host</code>.</p><ul style=\"margin: 6px 0 0 20px; padding-left: 0; list-style-type: square; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">\n<li style=\"margin-bottom: 4px;\">The second number is your rack. The third is the VLAN.</li>\n<li style=\"margin-bottom: 4px;\">For example, rack 3's Data VLAN is VLAN 20, so its subnet is <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">10.3.20.0/24</code>.</li>\n</ul>\n</div>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #ea580c; border-radius: 4px; background-color: #fff7ed;\">\n<p style=\"margin: 0; color: #c2410c; font-weight: 700;\">Caution: R is a placeholder, not part of the address</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">Wherever you see a highlighted <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\"><span style=\"color: #b45309; font-weight: 700;\">R</span></code>, type your rack number.</p><ul style=\"margin: 6px 0 0 20px; padding-left: 0; list-style-type: square; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">\n<li style=\"margin-bottom: 4px;\">A device will reject an address that contains a letter, so an error usually means an R was left in place.</li>\n<li style=\"margin-bottom: 4px;\">Your own addresses are in your addressing plan, below.</li>\n</ul>\n</div>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">VLANs and subnets</h3>\n\n<div style=\"margin: 12px 0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">VLAN plan</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 10%;\" scope=\"col\">VLAN</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Name</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Subnet</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Gateway</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Hosts</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>10</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Management</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">10.<span style=\"color: #b45309; font-weight: 700;\">R</span>.10.0/24</code></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">.254</code> (switch)</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Proxmox host (.10), scanner VM (.20), admin laptop (.5)</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>20</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Data</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">10.<span style=\"color: #b45309; font-weight: 700;\">R</span>.20.0/24</code></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">.254</code> (switch)</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Team laptops and the vulnerable Pi, by DHCP (.100 to .199)</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>30</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Storage</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">10.<span style=\"color: #b45309; font-weight: 700;\">R</span>.30.0/24</code></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">.254</code> (switch)</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">NAS (.10)</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>40</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">DMZ</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">10.<span style=\"color: #b45309; font-weight: 700;\">R</span>.40.0/24</code></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">.1</code> (firewall)</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Web server VM (.10), FTP server VM (.11)</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>100</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Transit</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">10.<span style=\"color: #b45309; font-weight: 700;\">R</span>.100.0/24</code></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">none</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">The link between the firewall (.1) and the core switch (.254)</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>999</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Parking</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">none</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">none</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Unused ports, shut down</td>\n</tr>\n</tbody>\n</table>\n</div>\n\n<div style=\"margin: 12px 0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">Networks outside the switch</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 30%;\" scope=\"col\">Network</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Subnet</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Notes</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Uplink</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">10.<span style=\"color: #b45309; font-weight: 700;\">R</span>.200.0/24</code></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Your provider, the instructor rack, <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">.1</code>; your firewall's WAN <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">.2</code></td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Internet</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">203.0.113.0/24</code></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Shared by every rack. Lab DNS, time and package repository <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">.10</code></td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Internet Wi-Fi</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">198.51.100.0/24</code></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">CyberHub-Internet, broadcast by the instructor rack. Test laptops by DHCP</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Guest Wi-Fi</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">10.<span style=\"color: #b45309; font-weight: 700;\">R</span>.50.0/24</code></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">On the firewall only; firewall <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">.1</code>, guests by DHCP</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Out-of-band</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">192.168.1.0/24</code></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Switch OOB port <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">.254</code>; your laptop <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">.10</code></td>\n</tr>\n</tbody>\n</table>\n</div>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #0055ff; border-radius: 4px; background-color: #f0f4ff;\">\n<p style=\"margin: 0; color: #0033aa; font-weight: 700;\">Note: Why 203.0.113.x and 198.51.100.x?</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">Both are ranges set aside for documentation and labs. They look like public addresses but belong to no one, so they can't clash with a real network.</p>\n</div>\n\n<div style=\"margin: 12px 0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">Names your provider hosts</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 30%;\" scope=\"col\">Name</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Resolves to</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">www.rack<span style=\"color: #b45309; font-weight: 700;\">R</span>.lab</code></strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">10.<span style=\"color: #b45309; font-weight: 700;\">R</span>.200.2</code>, your WAN address. VIP-HTTP forwards it to the web server</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">ftp.rack<span style=\"color: #b45309; font-weight: 700;\">R</span>.lab</code></strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">10.<span style=\"color: #b45309; font-weight: 700;\">R</span>.200.2</code>, your WAN address. VIP-FTP forwards it to the FTP server</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">ns.lab</code></strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">203.0.113.10</code>, the lab DNS and time server</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">repo.lab</code></strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">203.0.113.10</code>, the package repository: <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">http://repo.lab</code></td>\n</tr>\n</tbody>\n</table>\n</div>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #0055ff; border-radius: 4px; background-color: #f0f4ff;\">\n<p style=\"margin: 0; color: #0033aa; font-weight: 700;\">Note: Why the DMZ has no switch gateway</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">The DMZ gateway is the firewall, not the switch, so every packet between the DMZ and your internal networks has to pass a firewall policy. If the switch routed the DMZ, that traffic would skip the firewall entirely.</p>\n</div>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Core switch port map</h3>\n\n<div style=\"margin: 12px 0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">Core switch port map</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 15%;\" scope=\"col\">Port</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Connects to</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Mode</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">VLANs</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>XG1</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Firewall internal port</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Access</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">100 Transit</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>XG2</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Firewall DMZ port</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Access</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">40 DMZ</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>XG3</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Proxmox host, NIC 1</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Trunk</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">10 untagged; 20 and 40 tagged</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>XG4</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">NAS</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Access</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">30 Storage</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>XG5</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Admin laptop</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Access</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">10 Management</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>XG6 to XG8</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Nothing</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Access, shut down</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">999 Parking</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>XG9</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Vulnerable Pi</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Access</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">20 Data</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>XG10 to XG12</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Team laptops</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Access</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">20 Data</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>OOB</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Laptop, for switch management</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Management port</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">none</td>\n</tr>\n</tbody>\n</table>\n</div>\n\n<div style=\"margin: 12px 0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">Firewall ports</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 30%;\" scope=\"col\">FortiWiFi 60E port</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Connects to</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Address</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>wan1</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Rack <span style=\"color: #b45309; font-weight: 700;\">R</span> uplink jack</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">10.<span style=\"color: #b45309; font-weight: 700;\">R</span>.200.2/24</code></td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>internal</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Core switch XG1</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">10.<span style=\"color: #b45309; font-weight: 700;\">R</span>.100.1/24</code></td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>dmz</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Core switch XG2</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">10.<span style=\"color: #b45309; font-weight: 700;\">R</span>.40.1/24</code></td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Wi-Fi (guest SSID)</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Guest laptops</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">10.<span style=\"color: #b45309; font-weight: 700;\">R</span>.50.1/24</code></td>\n</tr>\n</tbody>\n</table>\n</div>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">Your addressing plan</h3>\n\n<p style=\"margin: 0 0 14px;\">The Addressing table in the Report Builder's <a style=\"color: #003366; text-decoration: underline; font-weight: bold;\" href=\"https://glgoltz.github.io/report-builder/#diagram\" target=\"_blank\" rel=\"noopener\">Diagram tab</a> has a Planned column: this plan, filled in for your rack from the rack number on your Team Log cover. Work from it, not the patterns above, just as real network teams work from their own site's IP address records.</p>\n\n<ul style=\"margin: 0 0 16px 20px; padding-left: 0; list-style-type: square;\">\n<li style=\"margin-bottom: 8px;\">Beside each planned address is the one you entered for that device. Anything that differs is marked in amber, so a typo shows up before it costs you an hour.</li>\n<li style=\"margin-bottom: 8px;\">The plan is what the rack should be. Your entries are what you built. A match on paper still needs a test on the rack.</li>\n</ul>\n\n<h3 style=\"margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; color: #003366; font-size: 1.3em; line-height: 1.3;\">VLAN terms</h3>\n\n<p style=\"margin: 0 0 14px;\">Think of a VLAN as a separate switch inside the switch. A port's settings decide which of those inner switches it is plugged into.</p>\n\n<div style=\"margin: 12px 0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">VLAN terms</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 30%;\" scope=\"col\">Term</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Definition</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Access port</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Belongs to one VLAN. The device on it doesn't know VLANs exist.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Tag (802.1Q)</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">A label added to each frame that says which VLAN it belongs to.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Trunk port</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Carries several VLANs on one cable, so frames need tags to tell them apart.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Tagged / untagged</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Whether frames on that port carry the label.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Native VLAN (PVID)</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">The one VLAN whose frames cross a trunk without a label. A port has only one.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>SVI (VLAN interface)</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">The switch's own address inside a VLAN. Devices use it as their gateway.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Inter-VLAN routing</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">The switch passing traffic between its SVIs.</td>\n</tr>\n</tbody>\n</table>\n</div>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #00aa66; border-radius: 4px; background-color: #f2faf5;\">\n<p style=\"margin: 0; color: #006633; font-weight: 700;\">Tip: Three questions for any port</p>\n<ul style=\"margin: 6px 0 0 20px; padding-left: 0; list-style-type: square; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">\n<li style=\"margin-bottom: 4px;\">What is plugged into the other end?</li>\n<li style=\"margin-bottom: 4px;\">Does that device understand tags? Only switches, hypervisors and firewalls with VLAN interfaces do. If not, it is an access port.</li>\n<li style=\"margin-bottom: 4px;\">Which VLAN should its untagged traffic land in? That is its PVID.</li>\n</ul>\n</div>\n\n<div style=\"margin: 20px 0; padding: 14px 16px; border-left: 5px solid #00aa66; border-radius: 4px; background-color: #f2faf5;\">\n<p style=\"margin: 0; color: #006633; font-weight: 700;\">Tip: Tracking down a connection problem</p>\n<p style=\"margin: 6px 0 0; color: #1e293b; font-size: 0.95em; line-height: 1.55;\">Start with the symptom table on <strong><a style=\"color: #003366; text-decoration: underline; font-weight: bold;\" href=\"#ref/troubleshooting\">Reference: Troubleshooting</a></strong>, then come back here to check the plan.</
