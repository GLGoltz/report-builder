0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">Versions</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 15%;\" scope=\"col\">Version</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Date</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Summary</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>0.12.0</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">November 24, 2026</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Addressing plan, restoration sign-off and logo clean-up.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>0.11.0</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">November 23, 2026</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">The Report Builder replaces the Google Docs templates.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>0.10.4</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">November 23, 2026</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Pi first-boot tips.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>0.10.3</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">November 18, 2026</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Network Diagram app: VLAN colors.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>0.10.2</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">November 18, 2026</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Network Diagram app: mask fields and your logo.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>0.10.1</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">November 18, 2026</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">The vulnerable Pi installs from the repository too.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>0.10.0</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">November 18, 2026</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">The instructor rack's package repository.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>0.9.1</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">November 17, 2026</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Testing from the internet over Wi-Fi.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>0.9.0</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">November 17, 2026</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">The instructor rack becomes every rack's provider.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>0.8.3</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">November 17, 2026</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">SSP inventory from the Network Diagram app.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>0.8.2</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">November 17, 2026</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Pre-warmed scanner image.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>0.8.1</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">November 17, 2026</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Network Diagram app refinements.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>0.8.0</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">November 16, 2026</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">The Network Diagram app.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>0.7.1</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">November 16, 2026</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Wording pass and Team Log guidance.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>0.7.0</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">November 16, 2026</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Google templates, a running network diagram and CySA+ mapping.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>0.6.1</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">November 16, 2026</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Fixes from a full read-through of the student pages.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>0.6.0</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">November 12, 2026</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Longer labs split to fit one lab session each.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>0.5.0</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">November 12, 2026</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Links between pages, a language pass, capture cues and less hand-holding.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>0.4.0</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">November 12, 2026</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Vulnerability scanner as an appliance.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>0.3.0</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">November 12, 2026</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">iPads removed, leaner deliverables, Rack Explorer learning tools.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>0.2.0</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">November 12, 2026</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Troubleshooting page and reference cleanup.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>0.1.0</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">November 10, 2026</td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">First draft, converted from the Cyber 4 Project Guide.</td>\n</tr>\n</tbody>\n</table>\n</div>\n\n<h4 style=\"margin: 24px 0 8px; color: #1e293b; font-size: 1.05em;\">0.12.0 (November 24, 2026)</h4>\n\n<div style=\"margin: 12px 0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">Changes in 0.12.0</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 15%;\" scope=\"col\">Type</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Change</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Changed</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">The rack sheet is gone. The Diagram tab's Addressing table now has a Planned column, filled in from the rack number on the Team Log cover, and marks in amber any address that differs from the plan. Pages that said \"your rack sheet\" now say \"your addressing plan\".</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Changed</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Cyber Hub 00 has two deliverables: the company profile and the rack-and-stack photo.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Added</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Cyber Hub 15 has a restoration record in the Team Log: a reset record for every device, the Utility Drawer list and an instructor sign-off with a sign-off code. USB Stick B's firewall backups and the laptops' lab route are now part of the reset.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Changed</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">The VAR's scope fills in from the client's rack on its cover.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Changed</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Cyber Hubs 00 and 14 no longer have troubleshooting tickets, and 00 has no commands section.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Changed</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Logos: the Report Builder trims a logo's empty margin and removes a plain background, and logos show larger on report covers and the diagram. Cyber Hub 00 gives the format to aim for.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Fixed</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">A cable's × on the diagram could hide behind the next port, and the logo placeholder's text ran outside its box. Long placeholder text in the Report Builder now wraps instead of being cut off.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Changed</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Troubleshooting tickets keep a work log: every hypothesis with its test, result and outcome, so the ones ruled out stay on record.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Changed</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Labels across the Report Builder and the pages use short professional terms: Proof, Contributions, Validation, Impact, Remediation, Configuration changes, Additional evidence.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Changed</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">The diagram keeps the same size as it fills in, so boxes don't jump and a scroll bar appears either always or never at a given window size.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Added</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">The style guide's callout boxes in the Report Builder's welcome (reopen it from Save and export, About), and a favicon. The signature lines appear as names are typed on the roster.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Fixed</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Accessibility: rail text contrast, labels for unlabeled text boxes, keyboard access to wide tables and the guides' code boxes, and the hypervisor and its VMs in the diagram are separate keyboard targets.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Changed</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">The reference pages moved from Canvas to the Report Builder's Reference tab. Links to them on the Cyber Hub pages open the app at that page. Start Here stays in Canvas.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Removed</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">The retired Google Docs templates, the Slides diagram starter and the old template generators.</td>\n</tr>\n</tbody>\n</table>\n</div>\n\n<h4 style=\"margin: 24px 0 8px; color: #1e293b; font-size: 1.05em;\">0.11.0 (November 23, 2026)</h4>\n\n<div style=\"margin: 12px 0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">Changes in 0.11.0</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 15%;\" scope=\"col\">Type</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Change</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Added</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">The Report Builder app holds the Team Log, the VAR and the SSP. Teams fill in forms and add screenshots; the app lays out every PDF they submit.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Added</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">VAR: imports Nmap and Greenbone XML, a triage step for scanner results, finding cards with a CVSS 3.1 calculator, fix priority, and a findings file the client imports into its POA&M.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Changed</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Report Builder PDFs follow the Canvas style guide: navy headings and table headers, cards and page numbers.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Added</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">SSP: inventory and addressing table from the Network Diagram, the twelve controls, POA&M and approval.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Changed</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Cyber Hubs 00, 12 and 13 and the final submission now use the Report Builder. Teams keep a team file in a shared Drive folder as their backup.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Changed</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">The rack sheet fills itself in from the rack number on the Team Log cover. Cyber Hub 00 now asks a teammate to check it against the Rack Schema page.</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Changed</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Team Log: four roster rows to start, a team agreement each member signs, troubleshooting tickets (issue, probable cause, tests, resolution, verification) with their own screenshots, and one Save and export menu. The tagline and the who's-typing picker are gone.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Changed</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">VAR handoff: assessors share the PDF and findings file with the client team's members only. Imported POA&amp;M rows leave the plan blank, with the assessors' recommendation beside it and a Response column (Remediate, Mitigate, Accept risk).</td>\n</tr>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Changed</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">The Network Diagram is now the Report Builder's Diagram tab. It saves in the team file, every Team Log export includes it, and the SSP adds it with one click. No more share link on the Team Log cover.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Added</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">The Report Builder opens with a one-time welcome: what each tab is for, how saving works and how to handle the VAR. Teams click I understand; it's under Save and export, About, any time after.</td>\n</tr>\n</tbody>\n</table>\n</div>\n\n<h4 style=\"margin: 24px 0 8px; color: #1e293b; font-size: 1.05em;\">0.10.4 (November 23, 2026)</h4>\n\n<div style=\"margin: 12px 0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">Changes in 0.10.4</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 15%;\" scope=\"col\">Type</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Change</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Changed</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Cyber Hub 11 adds a hint for an apt \"not valid yet\" error, which comes from the Pi's clock.</td>\n</tr>\n</tbody>\n</table>\n</div>\n\n<h4 style=\"margin: 24px 0 8px; color: #1e293b; font-size: 1.05em;\">0.10.3 (November 18, 2026)</h4>\n\n<div style=\"margin: 12px 0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">Changes in 0.10.3</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 15%;\" scope=\"col\">Type</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Change</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Added</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Each VLAN gets its own color on ports, cables, VMs and devices, with a legend that highlights one VLAN at a time. Trunk cables are striped with every VLAN they carry.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Added</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">A small × on every port with a cable removes that cable.</td>\n</tr>\n</tbody>\n</table>\n</div>\n\n<h4 style=\"margin: 24px 0 8px; color: #1e293b; font-size: 1.05em;\">0.10.2 (November 18, 2026)</h4>\n\n<div style=\"margin: 12px 0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">Changes in 0.10.2</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 15%;\" scope=\"col\">Type</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Change</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Changed</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Mask fields show a fixed / in front of the box, so you type only the number, such as 24.</td>\n</tr>\n<tr style=\"background-color: #f1f5f9;\">\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Added</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Upload your company logo from the placeholder in the top corner of the Network Diagram app. It shows there and in Export PNG. Cyber Hub 00 adds it.</td>\n</tr>\n</tbody>\n</table>\n</div>\n\n<h4 style=\"margin: 24px 0 8px; color: #1e293b; font-size: 1.05em;\">0.10.1 (November 18, 2026)</h4>\n\n<div style=\"margin: 12px 0 20px; overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; background-color: #ffffff; color: #334155; font-size: 0.92em; text-align: left;\">\n<caption style=\"position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;\">Changes in 0.10.1</caption>\n<thead>\n<tr>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600; width: 15%;\" scope=\"col\">Type</th>\n<th style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top; background-color: #003366; color: #ffffff; font-weight: 600;\" scope=\"col\">Change</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\"><strong>Changed</strong></td>\n<td style=\"padding: 9px 12px; border: 1px solid #cbd5e1; vertical-align: top;\">Cyber Hub 11: the Pi is flashed from the Raspberry Pi OS image on <code style=\"padding: 1px 5px; border: 1px solid #e2e8f0; border-radius: 4px; background-color: #f1f5f9; color: #0f172a; font-family: Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 0.9em;\">repo.lab</code> and installs its p // ---------------------------------------------------------------- IndexedDB
let db = null;
function openDB() {
  return new Promise((res, rej) => {
    if (!("indexedDB" in window)) return rej(new Error("no indexedDB"));
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { const d = r.result; for (const s of ["kv", "images", "history"]) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function idb(store, mode, fn) {
  return new Promise((res, rej) => {
    if (!db) return rej(new Error("no database"));
    const tx = db.transaction(store, mode), st = tx.objectStore(store);
    let out; const r = fn(st); if (r) r.onsuccess = () => { out = r.result; };
    tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
}
const kvGet = (k) => idb("kv", "readonly", (s) => s.get(k));
const kvSet = (k, v) => idb("kv", "readwrite", (s) => s.put(v, k));
const imgPut = (id, v) => idb("images", "readwrite", (s) => s.put(v, id));
const imgAll = () => new Promise((res, rej) => {
  const out = {}; const tx = db.transaction("images", "readonly"); const c = tx.objectStore("images").openCursor();
  c.onsuccess = () => { const cur = c.result; if (cur) { out[cur.key] = cur.value; cur.continue(); } };
  tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error);
});

function imageRefs(d) {
  const ids = new Set(); const walk = (o) => { if (!o) return; if (Array.isArray(o)) o.forEach(walk); else if (typeof o === "object") for (const k in o) walk(o[k]); else if (typeof o === "string" && /^img[0-9a-z]{8,}$/.test(o)) ids.add(o); };
  walk(d); return ids;
}

// ---------------------------------------------------------------- images
const IMG_MAX = 1600;
function readImage(file) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error("That isn't an image."));
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, IMG_MAX / Math.max(im.width, im.height));
      const c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let d = c.toDataURL("image/webp", 0.82);
      if (!d.startsWith("data:image/webp")) d = c.toDataURL("image/jpeg", 0.85);
      res(d);
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("That image couldn't be read.")); };
    im.src = url;
  });
}
async function addImage(file) {
  const data = await readImage(file);
  const id = newId("img");
  images[id] = data;
  try { await imgPut(id, data); } catch { saveFailed = true; renderSaveBar(); }
  return id;
}

// Troubleshooting tickets: the course's method (Reference: Troubleshooting) in a help-desk ticket's shape.

const TICKET_STATUS = [["open", "Open"], ["resolved", "Resolved"]];

// A ticket keeps every hypothesis the team tested, ruled out or confirmed, as a work log, the way a help desk

function ticketLog(p) {

    delete p.theory; delete p.checked;

}

// ------------------------------------------------------------------ Cyber Hub 15: restoration record and sign-off
// Like a decommissioning record (NIST SP 800-88's certificate of sanitization): every device reset, how the team
// checked it, the drawer inventory, then an instructor's sign-off.
//
// The instructor signs with a password only the instructors know. This file holds a salted PBKDF2 hash of it
// (half of the derived bits), so the app can tell the right password from a typo but can't reveal it. The other
// half of the derived bits never leaves the instructor's browser: it keys an HMAC of the record, shown as the
// sign-off code. A student can't make a valid code, and an instructor can check any code with Check a sign-off.
// If the record changes after signing, the app says so. To change the password: node tools/signoff-hash.mjs.
const SIGNOFF = { salt: "4a0f3c38c2e47c05bca82d13991b02a0", iter: 600000, check: "dc83abbb7a6782d980462b7e8f126f4a0d790228ebb822dc928f202eb44e160a" };

const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");

async function signoffKey(pw) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(normPw(pw)), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: enc.encode(SIGNOFF.salt), iterations: SIGNOFF.iter }, base, 512);
  if (hex(bits.slice(0, 32)) !== SIGNOFF.check) return null;
  return crypto.subtle.importKey("raw", bits.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
}
function restoreData() {
  const d = hubData("15");
  const r = d.extra.restore || (d.extra.restore = {});
  // Rebuild the rows only when the lists change (a new drawer list, say), keeping what the team entered.
  // Otherwise keep the same objects, because the page's checkboxes hold on to them.
  const same = (a, keys) => Array.isArray(a) && a.length === keys.length && a.every((x, i) => x && x[keys === DRAWER ? "item" : "device"] === keys[i]);
  const devs = RESETS.map(([d]) => d);
  if (!same(r.resets, devs)) r.resets = RESETS.map(([dev, how]) => { const o = (r.resets || []).find((x) => x.device === dev) || {}; return { device: dev, how, done: !!o.done, checked: o.checked || "", who: o.who || "" }; });
  else r.resets.forEach((x, i) => { x.how = RESETS[i][1]; });
  if (!same(r.drawer, DRAWER)) r.drawer = DRAWER.map((item) => { const o = (r.drawer || []).find((x) => x.item === item) || {}; return { item, present: !!o.present, note: o.note || "" }; });
  r.sign = r.sign || null;
  return r;
}
// What the signature covers: the team, the rack and every tick, plus who signed and when.
function restoreCanon(r, sign) {
  return JSON.stringify({ company: doc.meta.company || "", rack: String(doc.log.cover.rack || ""), team: members(),
    resets: r.resets.map((x) => [x.device, x.done]), drawer: r.drawer.map((x) => [x.item, x.present]), by: sign.by, date: sign.date });
}
async function sha(s) { return hex(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s))); }
async function makeCode(key, canon) {
  const h = hex(await crypto.subtle.sign("HMAC", key, new TextEncoder().encode(canon))).slice(0, 10).toUpperCase();
  return h.slice(0, 5) + "-" + h.slice(5);
}
const restoreComplete = (r) => r.resets.every((x) => x.done) && r.drawer.every((x) => x.present);
let sealState = { key: "", ok: true };
async function sealOk(r) {
  if (!r.sign) return true;
  const c = restoreCanon(r, r.sign);
  if (sealState.key === c) return sealState.ok;
  sealState = { key: c, ok: (await sha(c)) === r.sign.seal };
  return sealState.ok;
}
function restoreStatusSync(r) { return r.sign && sealState.key === restoreCanon(r, r.sign) ? (sealState.ok ? "signed" : "changed") : r.sign ? "signed" : "open"; }

function parseGreenbone(text) {

// ---- export
async function exportDoc(kind, arg) {
  diagramImg = await diagramPNG();
  if (doc.log.hubs["15"]?.extra?.restore?.sign) await sealOk(restoreData());
  let html, missing = [], title;
  const co = doc.meta.company || "Team";
  if (kind === "log-hub") {
    const l = LABS.find((x) => x.num === arg);
    title = `${co} Team Log, Cyber Hub ${l.num}`;
    html = (l.num === "00" ? logCoverHTML() : `<p class="runhead">${esc(co)} · Team Log</p>`) + hubHTML(l).replace('style="break-before:page"', "")
      + diagramHTML(`The diagram as of this export, Cyber Hub ${l.num}.`);
    if (!diagramImg && l.num !== "00") missing.push("Your network diagram (Diagram tab)");
    const d = doc.log.hubs[l.num];
    if (!d || !d.sessions.length) missing.push("A session entry");
    l.questions.forEach((q, i) => { if (!(d?.answers[i] || "").trim()) missing.push("An answer to: " + q.slice(0, 70) + (q.length > 70 ? "…" : "")); });
    l.deliverables.forEach((x) => { if (!SEPARATE[`${l.num}-${x.n}`] && !(d?.deliv[x.n]?.images || []).length) missing.push(`Deliverable ${x.n}: ${x.title}`); });
  } else if (kind === "log") {
    title = `${co} Team Log`;
    html = logCoverHTML() + diagramHTML("The diagram as of this export.") + LABS.map(hubHTML).join("");
    LABS.forEach((l) => { const st = hubStatus(l); if (st !== "done") missing.push(`Cyber Hub ${l.num} is ${st ? "incomplete" : "empty"}`); });
  } else if (kind === "var") { title = `${co} VAR for ${V().cover.client || "client"}`; html = varHTML(); missing = varMissing().map((x) => x[1]); }
  else if (kind === "ref") { const r = refOf(arg); title = `Reference: ${r.title}`; html = `<h1 class="s">${esc(r.title)}</h1>` + r.html; }
  else if (kind === "diagram") {
    title = `${co} network diagram`;
    html = `<p class="runhead">${esc(co)}</p>` + diagramHTML("Exported " + new Date().toLocaleDateString()).replace(' style="break-before:page"', "");
    if (!diagramImg) missing.push("The diagram itself");
  }
  else { title = `${co} System Security Plan`; html = sspHTML(); missing = sspMissing().map((x) => x[1]); }
  const go = () => {
    $("print").innerHTML = `<div class="doc">${html}</div>`;
    const old = document.title; document.title = title;
    const imgs = [...$("print").querySelectorAll("img")];
    Promise.all(imgs.map((i) => i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; }))).then(() => {
      setTimeout(() => { try { window.print(); } catch {} document.title = old; }, 50);
    });
  };
  const tip = h("p", { class: "hintline" }, "In the print window, set Destination to Save as PDF. Turn off Headers and footers under More settings.");
  if (missing.length) ask("Some parts are still empty", [h("p", {}, "You can export anyway. These will show as \"Not filled in\":"), h("ul", { class: "missing-list" }, missing.slice(0, 12).map((m) => h("li", {}, m)), missing.length > 12 ? h("li", {}, `and ${missing.length - 12} more`) : null), tip], [["Go back"], ["Export anyway", go, "primary"]]);
  else ask("Export as PDF", [h("p", {}, "Your browser's print window opens next."), tip], [["Cancel"], ["Continue", go, "primary"]]);
}

document.addEventListener("click", (e) => {

  e.preventDefault(); openRef(a.getAttribute("href").slice(5)); history.replaceState(null, "", a.getAttribute("href"));
});
window.addEventListener("hashchange", () => { const m = location.hash.match(/^#ref\/([a-z0-9-]+)/); if (m) openRef(m[1]); });

// ---- save bar
function renderSaveBar() {
  const bar = $("savebar"), s = $("saved"), b = $("backup");
  bar.classList.toggle("bad", saveFailed);
  if (!db) s.textContent = "This browser can't save here. Use Save team file to keep your work.";
  else if (saveFailed) s.textContent = "Couldn't save in this browser. Back up now so nothing is lost.";
  else s.textContent = doc.meta.updated ? `Saved in this browser ${fmtTime(doc.meta.updated).replace(/^.*?, /, "at ")}` : "Saves in this browser as you type.";
  const age = Date.now() - (lastBackup || sessionStart), edited = !!doc.meta.updated && dirtySinceBackup;
  if (backupState === "on") {
    b.replaceChildren(h("span", { class: "bk ok" }, h("i"), lastBackup ? `Automatic backup on, last written ${ago(lastBackup)}` : "Automatic backup on"));
  } else if (backupState === "paused") {
    b.replaceChildren(h("span", { class: "bkwarn" }, "Automatic backup is paused.", h("button", { class: "small", onclick: resumeBackup }, "Resume backups")));
  } else if (edited && (!lastBackup || age > 20 * 60e3)) {
    const msg = lastBackup ? `Last backup ${ago(lastBackup)}. Save a new team file so nothing is lost.` : "Not backed up yet. Save a team file so a lost laptop can't lose your work.";
    b.replaceChildren(h("span", { class: "bkwarn" + (age > 60 * 60e3 ? " red" : "") }, msg, h("button", { class: "small", onclick: backupNow }, "Back up now")));
  } else {
    b.replaceChildren(h("span", { class: "bk ok" }, h("i"), lastBackup ? `Backed up ${ago(lastBackup)}` : "Nothing to back up yet"), lastBackup ? h("button", { class: "small", onclick: backupNow }, "Back up now") : null);
  }
}
setInterval(renderSaveBar, 60e3);
setInterval(() => writeBackup(false), BACKUP_EVERY);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { save(); writeBackup(false); } });
window.addEventListener("beforeunload", (e) => {
  if (dirtySinceBackup && backupState !== "on" && doc.meta.updated && Date.now() - (lastBackup || 0) > 20 * 60e3) { e.preventDefault(); e.returnValue = ""; }
});

// ---- who's typing
function fillWho() { }
// ---- tabs and menus
for (const b of document.querySelectorAll("[data-tab]")) b.addEventListener("click", () => { state.tab = b.dataset.tab; state.sel = null; renderAll(); $("work").scrollTop = 0; });
const menu = $("filemenu"), mbtn = $("b-file");
mbtn.addEventListener("click", (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; mbtn.setAttribute("aria-expanded", String(!menu.hidden)); });
document.addEventListener("click", () => { menu.hidden = true; mbtn.setAttribute("aria-expanded", "false"); });
$("b-export").addEventListener("click", () => {
  if (state.tab === "diagram") return exportDoc("diagram");
  if (state.tab === "var") return exportDoc("var");
  if (state.tab === "ssp") return exportDoc("ssp");
  if (state.tab === "ref") return exportDoc("ref", state.ref);
  const l = LABS.find((x) => x.num === state.log);
  ask("Export the Team Log", [h("p", {}, "Each Cyber Hub page asks for that Cyber Hub's section. The final submission takes the whole log.")],
    [["Cancel"], ["Whole log", () => exportDoc("log")], l ? [`Cyber Hub ${l.num}`, () => exportDoc("log-hub", l.num), "primary"] : ["Cyber Hub 00", () => exportDoc("log-hub", "00"), "primary"]]);
});
$("b-save").addEventListener("click", backupNow);
$("b-open").addEventListener("click", async () => {
  const f = await pickFile(".cyberhub,application/json"); if (!f) return;
  let x; try { x = parseTeamFile(await f.text()); } catch (e) { return toast(e.message, true); }
  const newer = doc.meta.updated > x.savedAt + 60e3 && imageRefs(doc).size + JSON.stringify(doc.log).length > 2000;
  ask("Open this team file?", [h("p", {}, `${f.name}, saved ${x.savedAt ? fmtTime(x.savedAt) : "at an unknown time"}${x.savedBy ? " by " + x.savedBy : ""}.`),
    newer ? h("p", { class: "note warn" }, `This browser has work from ${fmtTime(doc.meta.updated)}, newer than the file. Opening the file replaces it. A copy stays in History.`) : h("p", {}, "It replaces what's in this browser. A copy of the current work stays in History.")],
    [["Cancel"], ["Add it to mine instead", () => mergeFile(x)], ["Open it", () => loadTeamFile(x).then(() => toast("Team file opened.")), "primary"]]);
});
$("b-merge").addEventListener("click", async () => {
  const f = await pickFile(".cyberhub,application/json"); if (!f) return;
  try { mergeFile(parseTeamFile(await f.text())); } catch (e) { toast(e.message, true); }
});
$("b-history").addEventListener("click", showHistory);
$("b-setup").addEventListener("click", () => {
  const framed = (() => { try { return window.self !== window.top; } catch { return true; } })();
  if (framed) return ask("Open the app on its own page", [h("p", {}, "Automatic backup can't run inside another page, such as a preview. Open the Report Builder at its own address, then set it up there:"), h("p", {}, h("code", {}, "https://glgoltz.github.io/report-builder/"))], [["OK", null, "primary"]]);
  if (!canAutoBackup()) return ask("Automatic backup isn't available here", [h("p", {}, "This browser can't write a backup file by itself. Chrome and Edge on a Windows, Mac or Chromebook laptop can; phones, tablets, Firefox, Safari and Brave can't."), h("p", {}, "Use Back up now in the save bar at the end of each session, and upload the file to your team's Google Drive folder.")], [["OK", null, "primary"]]);
  ask("Set up automatic backup", [h("p", {}, "Pick where the backup file goes. The app rewrites that one file every few minutes while you work, and when you leave the page."),
    h("p", {}, "If this laptop has Google Drive for desktop, pick your team's Drive folder and the backup reaches Drive by itself. Otherwise pick Documents, and upload the file to Drive at the end of the session.")],
    [["Cancel"], ["Choose the file", setupBackup, "primary"]]);
});
// ---- welcome: shown once per browser (and again when WELCOME_V changes), and from the menu
const WELCOME_KEY = "cyberhub-reports-welcome", WELCOME_V = "1";
// The Canvas style guide's callout box: colored left rule, tinted background, colored title.
const callout = (kind, title, ...kids) => h("div", { class: "callout " + kind, role: kind === "danger" ? "note" : null }, h("p", { class: "ct" }, title), ...kids);
function welcomeBody() {
  const sec = (t, ...kids) => h("div", { class: "wsec" }, h("h3", {}, t), ...kids);
  return [
    h("p", { class: "wlead" }, "This is where your team keeps its whole project: the Team Log, your network diagram, and the two reports you write for a client. You fill in the forms; the app lays out every PDF you submit."),
    sec("Why it works this way", h("p", {}, "Security teams don't format reports by hand. Assessors fill in finding cards in a reporting platform, compliance teams answer control by control, and the tool produces the document. You'll work the same way.")),
    sec("What's in each tab", h("ul", {},
      h("li", {}, h("b", {}, "Team Log: "), "your cover, signed team agreement, and a section for every Cyber Hub: sessions, commands, troubleshooting tickets, answers and deliverables. It's your team's record as much as something you hand in."),
      h("li", {}, h("b", {}, "Diagram: "), "the network you've built, updated whenever a page says so, with the addressing plan for your rack beside it. Every Cyber Hub export includes it."),
      h("li", {}, h("b", {}, "VAR: "), "the vulnerability assessment you write about another team's rack in Cyber Hub 12."),
      h("li", {}, h("b", {}, "SSP: "), "your own system security plan, in Cyber Hub 13."),
      h("li", {}, h("b", {}, "Reference: "), "the rack, the rack schema and VLAN plan, laptop setup, troubleshooting, lab rules, and startup and shutdown. Links on the Cyber Hub pages open it here."))),
    callout("caution", "Saving your work", h("ul", {},
      h("li", {}, "Your work saves as you type, but only in this browser on this laptop."),
      h("li", {}, h("b", {}, "Back up at the end of every session: "), "Save and export, then Save team file. Put the file in your team's Google Drive folder. That file is your real copy."),
      h("li", {}, "At the start of a session on a different laptop, open the newest team file with Open team file."),
      h("li", {}, "In Chrome or Edge, Set up automatic backup keeps a file up to date for you. A red warning at the top means you haven't backed up."),
      h("li", {}, "One person types each session. Teammates can draft on their own laptops and the typist adds their work with Add from a teammate's file."))),
    callout("danger", "Handle it like real client work", h("p", {}, "Your VAR describes how to break into another team's network. Share it only with that team's members, never with \"anyone with the link\".")),
  ];
}
function showWelcome(first) {
  ask(first ? "Welcome to the Report Builder" : "About the Report Builder", welcomeBody(),
    first ? [["I understand", () => { try { localStorage.setItem(WELCOME_KEY, WELCOME_V); } catch {} }, "primary"]] : [["Close", null, "primary"]]);
  $("modal").querySelector(".card").classList.add("wide");
}
$("b-help").addEventListener("click", () => showWelcome(false));

// ---- history
async function showHistory() {
  let list = []; try { list = (await historyList()).sort((a, b) => b.at - a.at); } catch {}
  if (!list.length) return ask("History", [h("p", {}, "No saved versions yet. The app keeps one every few minutes while you work.")], [["OK", null, "primary"]]);
  ask("History", [h("p", {}, "Restoring replaces the current work. The current work is saved in History first, so you can come back."),
    h("ul", { class: "hist" }, list.slice(0, 120).map((x) => h("li", {}, h("span", {}, h("b", {}, fmtTime(x.at)), " · ", x.label, x.by ? " · " + x.by : ""),
      h("button", { class: "small", onclick: async () => { closeModal(); await snapshot("Before restoring"); try { doc = normalize(JSON.parse(x.json)); commit(); await save(); renderAll(); toast("Restored the version from " + fmtTime(x.at) + "."); } catch { toast("That version couldn't be restored.", true); } } }, "Restore"))))],
  [["Close"]]);
}

// ---- merge a teammate's file: add what's missing, overwrite nothing
async function mergeFile(x) {
  await snapshot("Before adding a teammate's file");
  const o = x.doc; let n = { hosts: 0, triage: 0, findings: 0, sessions: 0, problems: 0, images: 0, poam: 0, answers: 0 };
  for (const id in x.images) if (!images[id]) { images[id] = x.images[id]; try { await imgPut(id, x.images[id]); } catch {} }
  const V2 = doc.var;
  for (const hst of o.var.hosts) if (!V2.hosts.some((y) => y.ip === hst.ip)) { V2.hosts.push(hst); n.hosts++; }
  for (const t of o.var.triage) if (!V2.triage.some((y) => y.id === t.id || (y.oid === t.oid && y.port === t.port))) { V2.triage.push(t); n.triage++; }
  for (const f of o.var.findings) if (!V2.findings.some((y) => y.id === f.id)) { V2.findings.push(f); n.findings++; }
  for (const num in o.log.hubs) {
    const a = hubData(num), b = o.log.hubs[num];
    for (const s of b.sessions) if (!a.sessions.some((y) => y.date === s.date && y.who === s.who)) { a.sessions.push(s); n.sessions++; }
    for (const p of b.problems) if (!a.problems.some((y) => y.broke === p.broke && y.fixed === p.fixed)) { a.problems.push(p); n.problems++; }
    for (const id of b.shots || []) { a.shots = a.shots || []; if (!a.shots.includes(id)) { a.shots.push(id); n.images++; } }
    for (const k in b.answers) if (!(a.answers[k] || "").trim() && (b.answers[k] || "").trim()) { a.answers[k] = b.answers[k]; n.answers++; }
    for (const k in b.deliv) { const ad = a.deliv[k] || (a.deliv[k] = { images: [], note: "", link: "" }); for (const id of b.deliv[k].images || []) if (!ad.images.includes(id)) { ad.images.push(id); n.images++; } if (!ad.note && b.deliv[k].note) ad.note = b.deliv[k].note; if (!ad.link && b.deliv[k].link) ad.link = b.deliv[k].link; }
    if (!a.commands.trim() && b.commands) a.commands = b.commands; else if (b.commands && !a.commands.includes(b.commands)) a.commands += "\n\n" + b.commands;
  }
  if (o.diagram && !doc.diagram) { doc.diagram = o.diagram; n.diagram = 1; }
  for (const r of o.ssp.poam) if (!doc.ssp.poam.some((y) => y.source && y.source === r.source && y.weakness === r.weakness)) { doc.ssp.poam.push(r); n.poam++; }
  commit(); renderAll();
  const parts = Object.entries({ findings: "findings", hosts: "hosts", triage: "scanner results", sessions: "sessions", problems: "problems", answers: "answers", images: "screenshots", poam: "POA&M rows", diagram: "diagram" }).filter(([k]) => n[k]).map(([k, t]) => `${n[k]} ${t}`);
  toast(parts.length ? "Added " + parts.join(", ") + "." : "Nothing new in that file.");
}

// ---- start
const sessionStart = Date.now();
(async function init() {
  try { db = await openDB(); } catch { db = null; }
  if (db) {
    try { const s = await kvGet("doc"); if (s) doc = normalize(JSON.parse(s)); } catch {}
    try { images = await imgAll(); } catch {}
    try { lastBackup = (await kvGet("lastBackup")) || 0; } catch {}
    await restoreBackupHandle();
    try { if (navigator.storage?.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); } catch {}
  }
  dirtySinceBackup = !!doc.meta.updated && doc.meta.updated > lastBackup;
  if (location.hash === "#diagram") state.tab = "diagram";
  const rm = location.hash.match(/^#ref\/([a-z0-9-]+)/); if (rm && REFS.length) { state.tab = "ref"; state.ref = refOf(rm[1]).slug; }
  // The Diagram tab's page loads once the document is here, and stays loaded (off screen) so exports can draw it.
  document.querySelector(".main").prepend(h("iframe", { id: "dframe", src: "diagram.html", title: "Network diagram", class: "offstage" }));
  renderAll();
  let seen = ""; try { seen = localStorage.getItem(WELCOME_KEY) || ""; } catch {}
  if (seen !== WELCOME_V) showWelcome(true);
})();
</script></body></html>
