<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network Diagram</title><style>:root{--navy:#003366;--ink:#0f172a;--body:#334155;--muted:#64748b;--border:#cbd5e1;--hair:#e2e8f0;--page:#f8fafc;--card:#fff;--amber:#b45309;--sel:#2563eb;--err:#b91c1c}
[hidden]{display:none!important}

.bar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap}

.menu{position:relative}

.main{flex:1;display:flex;min-height:0}

#svg{width:100%;min-width:900px;height:auto;display:block;background:#fff;border:1px solid var(--border);border-radius:10px;user-select:none;-webkit-user-select:none;touch-action:pan-x pan-y}

.scrollhint{display:none;margin:0 0 6px;font-size:12.5px;color:var(--muted)}
.viewtabs{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;margin:0 0 10px;background:#fff}

.viewtabs button[aria-selected=true]{background:var(--navy);color:#fff}
.tableview{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px 20px}
.tableview .thead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:0 0 8px}

table.topo{width:100%;border-collapse:collapse;font-size:13.5px}

.tableview{overflow-x:auto}

.list{flex:1;min-width:0;overflow:auto;padding:16px 20px}
.panel{width:380px;flex:none;border-left:1px solid var(--border);background:#fff;overflow:auto;padding:16px}

.card-b{border:1px solid var(--hair);border-radius:8px;padding:10px 12px;margin:0 0 10px}

.list .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;align-items:start}
.list .card-b.wide{grid-column:1/-1}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;z-index:50;max-width:90vw}

.m-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
/* drawing: these rules are also copied into PNG exports */
.d-box{fill:#fff;stroke:var(--navy);stroke-width:1.5}
.d-box.fixed{fill:#eef2f7}
.d-name{font:600 17px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#0f172a}
.d-val{font:14px ui-monospace,Consolas,Menlo,monospace;fill:#b45309}
.d-vm{fill:#fff;stroke:#94a3b8;stroke-width:1}
.d-vmname{font:600 13.5px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#0f172a}
.d-case{stroke:#ffffff;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.d-link{stroke:#1e3a8a;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.d-link.wifi{stroke-width:2.25;stroke-dasharray:7 6}
.d-plug{fill:#1e3a8a;stroke:#ffffff;stroke-width:1.5}
.port.on .d-port{fill:#dbeafe;stroke:#1e3a8a;stroke-width:1.6}
.d-vmhost{font:12px ui-monospace,Consolas,Menlo,monospace;fill:#64748b}
.d-port{fill:#f8fafc;stroke:#64748b;stroke-width:1.2}

.d-pname{font:700 12px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#0f172a}
.d-pmode{font:10.5px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#475569}
.d-pvl{font:10.5px ui-monospace,Consolas,Menlo,monospace;fill:#b45309}
.d-tab{fill:#003366;stroke:#003366}
.d-tabname{font:600 11.5px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#fff}
.d-div{stroke:#e2e8f0;stroke-width:1}
.d-lab{font:13px ui-monospace,Consolas,Menlo,monospace;fill:#1e3a8a;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.d-title{font:700 20px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#003366}
.d-sub{font:13px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#64748b}
/* interface only, never exported */
.dev{cursor:pointer}
.dev.drop .d-box{stroke:var(--sel);stroke-width:3}
.dev.sel .d-box{stroke:var(--sel);stroke-width:3}
.vm.sel .d-vm{stroke:var(--sel);stroke-width:2.5}
.vm{cursor:pointer}
.handle{fill:#fff;stroke:var(--navy);stroke-width:1.5;cursor:crosshair;opacity:.55;transition:opacity .12s}
.dev:hover .handle,.dev.sel .handle,.dev:focus .handle{opacity:1}
.hit{stroke:transparent;stroke-width:14;fill:none;cursor:pointer}
.port{cursor:crosshair}
.port:hover .d-port{stroke:var(--sel);stroke-width:2}
.port:hover .d-tab{fill:#1e4f8a}
.port.drop .d-port{stroke:var(--sel);stroke-width:2.5}
.lk.sel .d-link{stroke:var(--sel)}
.lk.sel .d-plug{fill:var(--sel)}
.temp{stroke:var(--sel);stroke-width:2;stroke-dasharray:4 4;fill:none;pointer-events:none}
.drop .d-box{stroke:var(--sel);stroke-width:3}
.ghint{font:15px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#64748b}

@media (max-width:900px){
 html,body{height:auto}

}

}
@media print{.bar,.savebar,.panel,.toast,.modal{display:none!important}.main{display:block}.stage{padding:0;overflow:visible}#svg{border:0;min-width:0}.ghint{display:none}.dev.sel .d-box{stroke:#003366;stroke-width:1.5}}
.when{margin:0 0 10px;padding-left:18px;font-size:13px;line-height:1.45}
.when li{margin:0 0 5px}
.modal .card{max-height:88vh;overflow:auto}
.hit{stroke-width:10}
table.t.ports{table-layout:fixed}
table.t.ports th:nth-child(1){width:48px}table.t.ports th:nth-child(2){width:92px}table.t.ports th:nth-child(3){width:70px}table.t.ports th:nth-child(5){width:34px}
table.t.ports select{padding:4px 2px}
table.topo.conn td{font-family:inherit;font-size:13.5px;color:var(--body)}
table.topo.conn td:nth-child(2),table.topo.conn td:nth-child(4),table.topo.conn td:nth-child(6){font-family:ui-monospace,Consolas,Menlo,monospace;font-size:13px;color:var(--amber)}
.pfx{display:flex}
.pfx>.slash{display:flex;align-items:center;padding:0 7px;border:1px solid var(--border);border-right:0;border-radius:5px 0 0 5px;background:#f1f5f9;color:var(--muted);font-weight:700}
.pfx>input{border-top-left-radius:0;border-bottom-left-radius:0}
.logoprev{display:block;max-width:160px;max-height:86px;margin:6px 0 8px;border:1px solid var(--hair);border-radius:5px;background:#fff;padding:4px}
.logo-slot{cursor:pointer}
.logo-slot:focus-visible{outline:none}
.logo-slot:focus-visible .logo-ph,.logo-slot:focus-visible .logo-hit{stroke:var(--sel);stroke-width:2}
.logo-ph{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 4}
.logo-slot.empty:hover .logo-ph{fill:#eef2f7;stroke:var(--navy)}
.logo-ph-t{font-size:14px;font-weight:700;fill:var(--navy)}
.logo-ph-s{font-size:11.5px;fill:var(--muted)}
.logo-hit{fill:transparent;stroke:none;rx:8}
.logo-slot:hover .logo-hit{stroke:var(--border);stroke-dasharray:4 3}
/* VLAN colors */
.d-vpill{font:700 10.5px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#fff}
.d-legh{font:700 12px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#0f172a;letter-spacing:.04em;text-transform:uppercase}
.d-legt{font:12.5px ui-monospace,Consolas,Menlo,monospace;fill:#334155}
.leg{cursor:default}
.leg:focus-visible{outline:none}.leg:focus-visible .d-legt{text-decoration:underline}
#svg [data-vl],#svg .dev{transition:opacity .2s ease}
#svg.vfocus .lk:not(.hl),#svg.vfocus .dev:not(.hl):not(:has(.hl)),#svg.vfocus .k-switch .port:not(.hl),#svg.vfocus .vm:not(.hl),#svg.vfocus .leg:not(.hl){opacity:.16}
/* Motion: light and CSS-only */
.d-flow{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-dasharray:1.5 18;opacity:0;pointer-events:none}
.lk.busy .d-flow{opacity:.95;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-19.5}}
.lk.fresh .d-link:not(.stripe){animation:drawin .7s ease-out}
.lk.fresh .d-link.stripe{animation:fadein .5s ease-out}
@keyframes drawin{from{stroke-dasharray:2000;stroke-dashoffset:2000}to{stroke-dasharray:2000;stroke-dashoffset:0}}
#svg.intro .dev,#svg.intro .lk,#svg.intro .legend{animation:fadein .5s ease-out both}
#svg.intro .dev:nth-child(2n){animation-delay:.06s}#svg.intro .dev:nth-child(3n){animation-delay:.12s}#svg.intro .lk{animation-delay:.2s}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#svg.intro .dev{animation-name:fadein2}
@keyframes fadein2{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#svg *,#svg{animation:none!important;transition:none!important}}
/* Unplug buttons */
.unplug{cursor:pointer}

.unplug:hover circle{fill:#fee2e2;stroke:#b91c1c}.unplug:hover path{stroke:#b91c1c}
.unplug:focus-visible{outline:none}.unplug:focus-visible circle{stroke:var(--sel);stroke-width:2}

</style></head><body>
<header class="bar">
 <div class="brand"><b>Network Diagram</b><small>Cyber Hub</small></div>
 <label class="company"><span>Company</span><input id="company" placeholder="Your company name" autocomplete="off"></label>
 <div class="acts">
  <button id="b-help">How to use</button>
  <button id="b-undo" title="Undo (Ctrl+Z)">Undo</button>

  <div class="menu"><button id="b-more" aria-haspopup="true" aria-expanded="false">More</button>

   </div></div>
  <input type="file" id="file" accept=".json,application/json" hidden>

 </div>
</header>

<main class="main">
 <section class="stage" id="stage">
  <div class="viewtabs" role="tablist" aria-label="View">
   <button role="tab" id="t-canvas" aria-selected="true">Diagram</button>
   <button role="tab" id="t-table" aria-selected="false">Addressing table</button>
  </div>
  <div id="v-canvas">
   <p class="scrollhint">Scroll sideways to see the whole diagram.</p>
   <svg id="svg" viewBox="0 0 1600 800" role="application" aria-label="Network diagram. Select a device to edit it."></svg>
  </div>
  <div id="v-table" class="tableview" hidden></div>
 </section>
 <aside class="panel" id="panel" aria-label="Editor"></aside>
</main>
<div class="toast" id="toast" role="status" hidden></div>
<div class="modal" id="modal" hidden><div class="card" role="dialog" aria-modal="true" aria-labelledby="m-title"><h2 id="m-title"></h2><div id="m-body"></div><div class="m-acts" id="m-acts"></div></div></div>
<script>// Network Diagram: the Report Builder's Diagram tab (diagram.html, shown in a frame by index.html).
//
// Inside the Report Builder it loads and saves through window.parent.rbDiagram, so the diagram travels in the
// team file with history and backups. Opened on its own with a share link, it is a viewer that saves nothing.
// It never receives the team's rack number, so it can't check entries against the plan.
//
// Hard rule (DIAGRAM_APP_SPEC.md, section 2): this file holds no rack plan. No expected addresses, VLANs,
// port assignments, routes or policies. Everything drawn comes from what the team typed. The only built-in
// facts are the devices in the rack, the switch's port names and the firewall's interface names, which
// students already have on the reference pages.
"use strict";
(() => {
const SCHEMA = 2;
const KEY = "cyberhub-diagram";
const LOGO_MAX = 40000; // characters of data URL; the logo rides in the share link, so it stays small
const VB = { w: 1540, h: 900 };
const HOST = (() => { try { return window.parent !== window && window.parent.rbDiagram ? window.parent.rbDiagram : null; } catch { return null; } })();
if (HOST) document.documentElement.classList.add("embedded");
const SW_PORTS = ["XG1","XG2","XG3","XG4","XG5","XG6","XG7","XG8","XG9","XG10","XG11","XG12","OOB"];
const FW_IFS = ["wan1", "internal", "dmz", "guest Wi-Fi"];
const SERVICES = ["ALL", "PING", "HTTP", "HTTPS", "SSH", "FTP", "DNS"];
const KINDS = {
  isp: "Provider", firewall: "Firewall", switch: "Switch", hypervisor: "Hypervisor", nas: "NAS",
  pi: "Raspberry Pi", laptop: "Laptop", vm: "Virtual machine",
};
const ENDPOINT = new Set(["hypervisor", "nas", "pi", "laptop", "vm"]);

const $ = (id) => document.getElementById(id);
const svg = $("svg"), panel = $("panel"), tableView = $("v-table");
const NS = "http://www.w3.org/2000/svg";

// ------------------------------------------------------------------ document
// Every rack has the same devices, so the set is fixed: nothing is added, deleted or moved.
let uid = 0;
const newId = (p) => p + Date.now().toString(36) + (uid++).toString(36);
const ep = () => ({ hostname: "", address: "", mask: "", gateway: "", dhcp: false });
const vm = (id, name) => ({ id, kind: "vm", host: "hv", name, ...ep(), vlanTag: "" });
function blankDoc() {
  return {
    v: SCHEMA, meta: { company: "", updated: null },
    devices: [
      { id: "isp", kind: "isp", name: "Provider (instructor rack)", address: "", mask: "" },
      { id: "isplap", kind: "laptop", name: "Internet laptop", ...ep() },
      { id: "fw", kind: "firewall", name: "Firewall", hostname: "",
        interfaces: FW_IFS.map((n) => ({ name: n, address: "", mask: "", ...(n === "guest Wi-Fi" ? { ssid: "" } : {}) })),
        routes: [], vips: [], policies: [] },
      { id: "guest", kind: "laptop", name: "Guest laptop", ...ep() },
      { id: "sw", kind: "switch", name: "Core switch", hostname: "", oob: { address: "", mask: "" }, svis: [], routes: [], dhcpPools: [],
        ports: SW_PORTS.map((n) => ({ name: n, mode: "", pvid: "", tagged: [], shutdown: false })) },
      { id: "hv", kind: "hypervisor", name: "Hypervisor", ...ep() },
      vm("vmweb", "Web server"), vm("vmftp", "FTP server"), vm("vmscan", "Scanner"),
      { id: "nas", kind: "nas", name: "NAS", ...ep() },
      { id: "admin", kind: "laptop", name: "Admin laptop", ...ep() },
      { id: "pi", kind: "pi", name: "Vulnerable Pi", ...ep() },
      { id: "lap", kind: "laptop", name: "Team laptop", ...ep() },
    ],
    links: [],
  };
}
let doc = blankDoc();
const dev = (id) => doc.devices.find((d) => d.id === id);

// ------------------------------------------------------------------ selection

// ------------------------------------------------------------------ drawing

    .map((r) => r.cssText).filter((t) => /^\.(d-|port\.)/.test(t)).join("\n").replace(/var\(--navy\)/g, "#003366");
  el("style", {}, out).textContent = css;
  el("rect", { width: W, height: H, fill: "#ffffff" }, out);
  text(out, 30, 34, "d-title", (doc.meta.company || "Company") + " network diagram");
  text(out, 30, 54, "d-sub", "Updated " + new Date(doc.meta.updated || Date.now()).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" }));
  const g = el("g", { transform: `translate(${pad},${HD})` }, out);
  drawInto(g, false);
  const src = new XMLSerializer().serializeToString(out);
  const img = new Image();
  const url = URL.createObjectURL(new Blob([src], { type: "image/svg+xml" }));
  try {
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const c = document.createElement("canvas"); c.width = W * 2; c.height = H * 2;
    const ctx = c.getContext("2d"); ctx.scale(2, 2); ctx.drawImage(img, 0, 0);

  } finally { URL.revokeObjectURL(url); }
}
async function exportPng() {
  try {
    const c = await renderPng(); const blob = await new Promise((r) => c.toBlob(r, "image/png"));
    download(blob, fileBase() + ".png"); toast("PNG downloaded.");
  } catch { toast("This browser couldn't make the PNG. Try Print, then Save as PDF."); }
}
// Used by the Report Builder: the diagram as an image for the PDFs and the SSP, the share link, and a reload.
window.rbPNG = async () => { const c = await renderPng(); return c.toDataURL("image/png"); };
window.rbShareURL = shareURL;
window.rbDoc = () => JSON.parse(JSON.stringify(doc));
window.rbHasContent = () => hasContent(doc);
function hostLoad() { doc = normalize(HOST.load() || blankDoc()); sel = null; assignVlanColors(); hist = [snapshot()]; hi = 0; renderAll(); updateButtons(); }
window.rbReload = () => { if (HOST) hostLoad(); };
const fileBase = () => ((doc.meta.company || "network").replace(/[^\w-]+/g, "-").replace(/^-|-$/g, "") || "network") + "-diagram-" + new Date().toISOString().slice(0, 10);
function download(blob, name) { const a = h("a", { href: URL.createObjectURL(blob), download: name }); document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

// ------------------------------------------------------------------ small UI
let toastT;
function toast(s) { const t = $("toast"); t.textContent = s; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 3800); }
function ask(title, body, buttons) {
  const m = $("modal"), prev = document.activeElement;
  $("m-title").textContent = title; $("m-body").replaceChildren(...body);
  const close = () => { m.hidden = true; prev?.focus?.(); };
  $("m-acts").replaceChildren(...buttons.map(([label, fn, cls]) => h("button", { class: cls || (fn ? "primary" : ""), onclick: () => { close(); fn?.(); } }, label)));
  m.hidden = false; $("m-acts").lastChild?.focus({ preventScroll: true }); m.querySelector(".card").scrollTop = 0;
  m.onkeydown = (e) => { if (e.key === "Escape") close(); };
  m.onclick = (e) => { if (e.target === m) close(); };
}
function load(o, why) {
  doc = normalize(o); sel = null; hist = []; hi = -1; commit(); renderAll(); if (why) toast(why);
}

// ------------------------------------------------------------------ wiring
$("t-canvas").onclick = () => setView("canvas");
$("t-table").onclick = () => setView("table");
$("b-undo").onclick = undo; $("b-redo").onclick = redo;
$("b-help").onclick = help;
$("b-share").onclick = share; $("b-png").onclick = exportPng;
$("logofile").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  let d = null;
  try { d = await readLogo(f); } catch {}
  if (!d) { toast("That file couldn't be used as a logo. Try a PNG or JPG image."); return; }
  doc.meta.logo = d; commit(); renderAll(); toast("Logo added. It shows on your reports too.");
});
const more = $("more");
$("b-more").onclick = (e) => { e.stopPropagation(); more.hidden = !more.hidden; $("b-more").setAttribute("aria-expanded", !more.hidden); };
document.addEventListener("click", () => { more.hidden = true; $("b-more").setAttribute("aria-expanded", false); });
$("b-json").onclick = () => download(new Blob([JSON.stringify(portable(doc), null, 1)], { type: "application/json" }), fileBase() + ".json");
$("b-open").onclick = () => $("file").click();
$("file").onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try { const o = JSON.parse(await f.text()); normalize(o); ask("Open " + f.name + "?", [h("p", {}, "This replaces the diagram on screen. Copy its share link first if you want to keep it.")], [["Cancel"], ["Open", () => load(o, "Opened " + f.name)]]); }
  catch { toast("That file isn't a diagram backup."); }
};
$("b-print").onclick = () => { setView("canvas"); setTimeout(() => print(), 50); };
$("b-reset").onclick = () => ask("Reset the diagram?", [h("p", {}, "This clears every cable and setting."), h("p", { class: "muted" }, "You can undo this, and the Report Builder's History keeps earlier versions.")],
  [["Cancel"], ["Reset", () => { const co = doc.meta.company, lg = doc.meta.logo; doc = blankDoc(); doc.meta.company = co; if (lg) doc.meta.logo = lg; sel = null; sharedJSON = null; commit(); renderAll(); }, "danger"]]);
$("company").addEventListener("input", (e) => { doc.meta.company = e.target.value; });
$("company").addEventListener("change", commit);
document.addEventListener("keydown", (e) => {
  if (e.target.closest?.("input,textarea,select")) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  if ((e.ctrlKey || e.metaKey) && k === "y") { e.preventDefault(); redo(); }
  if (e.key === "Escape" && sel) select(null);
});
window.addEventListener("hashchange", () => start());

async function start() {
  if (HOST) { hostLoad(); $("saved").textContent = "Saves with your team file."; return; }
  if (!location.hash.startsWith("#d=") && window.parent === window) { location.replace("./#diagram"); return; }
  let local = null;
  try { const s = localStorage.getItem(KEY); if (s) local = normalize(JSON.parse(s)); } catch {}
  const m = location.hash.match(/^#d=(.+)$/);
  if (m) {
    let linked;
    try { linked = normalize(await decode(m[1])); } catch { history.replaceState(null, "", location.pathname + location.search); toast("That share link is incomplete or damaged."); }
    if (linked) {
      history.replaceState(null, "", location.pathname + location.search);
      sharedJSON = JSON.stringify(linked);
      const differs = local && contentOf(JSON.stringify(local)) !== contentOf(JSON.stringify(linked));
      if (differs && hasContent(local)) {
        doc = local; renderAll(); commit();
        ask("Which diagram do you want?", [h("p", {}, "This browser already holds a different diagram" + (local.meta.company ? ` (${local.meta.company})` : "") + "."),
          h("p", {}, "Opening the link replaces it. If you need the one in this browser, cancel and copy its share link first.")],
          [["Keep this browser's diagram", () => { sharedJSON = null; updateButtons(); }], ["Open the link", () => { load(linked, "Opened the shared diagram."); sharedJSON = snapshot(); updateButtons(); }]]);
        return;
      }
      load(linked, "Opened the shared diagram."); sharedJSON = snapshot(); updateButtons();
      return;
    }
  }
  doc = local || blankDoc(); sel = null; hist = []; hi = -1; commit(); renderAll();
}
start();
})();
