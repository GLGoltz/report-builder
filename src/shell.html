<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Builder</title><style>{{CSS}}</style></head><body>
<header class="bar">
 <div class="brand"><b>Report Builder</b><small id="brand-co">Cyber Hub</small></div>
 <div class="seg" role="tablist" aria-label="Document">
  <button role="tab" id="tab-log" data-tab="log" aria-selected="true">Team Log</button>
  <button role="tab" id="tab-diagram" data-tab="diagram" aria-selected="false">Diagram</button>
  <button role="tab" id="tab-var" data-tab="var" aria-selected="false">VAR</button>
  <button role="tab" id="tab-ssp" data-tab="ssp" aria-selected="false">SSP</button>
  <button role="tab" id="tab-ref" data-tab="ref" aria-selected="false">Reference</button>
 </div>
 <div class="acts">
  <div class="menu"><button id="b-file" class="primary big" aria-haspopup="true" aria-expanded="false">Save and export <span aria-hidden="true">▾</span></button>
   <div class="menu-list" id="filemenu" hidden>
    <p class="mh">Export</p>
    <button id="b-export">Export PDF of this tab</button>
    <p class="mh">Save your work</p>
    <button id="b-save">Save team file (backup)</button>
    <button id="b-setup">Set up automatic backup</button>
    <button id="b-open">Open team file</button>
    <button id="b-merge">Add from a teammate's file</button>
    <button id="b-history">History</button>
    <hr>
    <button id="b-help">About and how saving works</button>
   </div></div>
 </div>
</header>
<div class="savebar" id="savebar"><span id="saved" role="status"></span><span id="backup"></span></div>
<main class="main">
 <nav class="rail" id="rail" aria-label="Sections"></nav>
 <section class="work" id="work"></section>
 <aside class="panel" id="panel" aria-label="Editor" hidden></aside>
</main>
<div id="print" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="modal" id="modal" hidden><div class="card" role="dialog" aria-modal="true" aria-labelledby="m-title"><h2 id="m-title"></h2><div id="m-body"></div><div class="m-acts" id="m-acts"></div></div></div>
<script>{{JS}}</script></body></html>
